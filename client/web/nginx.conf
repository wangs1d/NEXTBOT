worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 允许大文件上传（最大 500MB）
    client_max_body_size 500m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    tcp_nopush on;

    # 压缩：聊天页/静态资源与所有 JSON 接口（含图片元数据）都受益，
    # 2M 带宽的机器上能明显减少传输时间与 API 出流量。
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/wasm image/svg+xml;

    # WebSocket 与非 WebSocket 分流：原来对所有请求都发 Connection: upgrade，
    # 会让普通 HTTP 无法复用上游长连接，每次都新建 TCP。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 上游 API 服务（keepalive 复用连接，减少握手与 TIME_WAIT）
    upstream api_upstream {
        server api:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 首页 → 聊天页
        location = / {
            return 301 /chat;
        }

        # 下载页面（由 nginx 直接提供）
        location = /downloads {
            root /usr/share/nginx/html;
            try_files /dn/index.html =404;
        }

        # 上传的应用文件（来自共享卷）
        location /downloads/files/ {
            alias /app/downloads/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }

        # 后端 API + WebSocket + 聊天页面（全部反代到 api 服务）
        location / {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # WebSocket 支持：普通请求的 Connection 为空，交给 keepalive 复用
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 上传不落 nginx 临时盘：默认会把大 body 先写 /tmp 再转发，
            # 2G 小盘上 500MB 上传会凭空占一份磁盘；关闭后直接流给 API。
            proxy_request_buffering off;

            # 超时
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
