name: nextbot
description: Nextbot MVP client
publish_to: "none"
version: 0.1.6+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  path_provider: ^2.1.4
  crypto: ^3.0.5
  http: ^1.2.2
  file_picker: ^8.1.6
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  webview_windows: ^0.4.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  image_picker: ^1.0.7
  video_player: ^2.8.5
  # 桌面端窗口控制（隐藏/显示/置顶）
  window_manager: ^0.4.3
  # 系统托盘：点 X 后台驻留，托盘恢复/退出
  tray_manager: ^0.4.0
  # 查询显示器布局：还原主窗口位置时校验是否仍在屏幕内（window_manager 的传递依赖，显式声明以便直接 import）
  screen_retriever: ^0.2.2
  # 系统级输入空闲查询（GetLastInputInfo）：久坐判断需要真实键鼠活动，
  # 不引入全局钩子。ffi 同为传递依赖，显式声明以便直接 import（同 screen_retriever 惯例）
  ffi: ^2.1.0
  flutter_timezone: ^5.1.0
  flutter_local_notifications: ^22.3.0
  highlight: ^0.7.0
  record: ^7.1.1
  # 开机简报在座检测：摄像头抓拍一帧交服务端视觉模型判定（Windows 端 camera_windows 实现）
  camera: ^0.11.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1
  path_provider_platform_interface: ^2.1.3

# audioplayers_windows 4.4.1 从媒体线程直发平台通道事件（引擎 messenger
# 非线程安全）→ flutter_windows.dll+0x14f37 AV 硬崩。本地 fork：
# event_stream_handler.h 经隐藏消息窗把事件转发到平台线程后才碰 EventSink。
dependency_overrides:
  audioplayers_windows:
    path: third_party/audioplayers_windows-4.4.1
  # webview_windows 0.4.0 原生 SendScroll 把滚轮事件坐标硬编码 (0,0)（页面
  # 左上角），滚轮永远打在标题栏上而非光标处 → MapLibre 等页面滚轮缩放/内层
  # 滚动全失效。fork 一行修复：WHEEL 事件改用 last_cursor_pos_（光标实时位置）。
  webview_windows:
    path: third_party/webview_windows-0.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/agent_avatars/
    - assets/fonts/
    # 系统托盘图标（点 X 后台驻留，见 core/services/app_tray_service.dart）
    - assets/tray_icon.ico
    # 灵动岛专用字体（GDI 直读文件，见 windows/runner/embedded_font.h）
    - assets/fonts/noto/NotoSansSC-Regular.otf
    - assets/fonts/noto/NotoSansSC-Medium.otf
    - assets/fonts/noto/NotoSansSC-Bold.otf
    - assets/fonts/noto/LICENSE.txt
    - assets/fonts/harmonyos/HarmonyOS_Sans_SC_Medium.ttf
    - assets/fonts/harmonyos/HarmonyOS_Sans_SC_Bold.ttf
    - assets/fonts/harmonyos/LICENSE.txt
    # 旅游行程地图模块（内嵌 MapLibre GL JS 单文件页面）
    # MapLibre 本地化副本（装载时内联进 html，WebView 零 CDN 等待）
    # emotion-ball 小球表情动画（自包含宿主页，来源 aora-bot，见目录内 ATTRIBUTION.md）
    - assets/emotion_ball/
    # 注册页右侧展示面板背景（C 案：织物侧光）
    - assets/register/
    # 共用浏览器注入运行时（framework-free JS，见 docs/shared-browser-architecture.md）
    - assets/shared_browser/
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.otf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.otf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.otf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.otf
          weight: 700
    # 数字展示字体（天气卡等指标大数，字形开口更大、小字号更清晰）
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/harmonyos/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/harmonyos/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
