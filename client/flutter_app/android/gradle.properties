org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 16G 内存机器：守护进程空闲 30 分钟即退出，不要占着 3 小时
org.gradle.daemon.idletimeout=1800000
# Gradle 8.14 不支持 JBR 25（Studio 自带）；本机现役 JDK（2026-11-13）：
# C:\Program Files\Java\jdk-17（17.0.12 LTS）。原 D:/jdk21/jdk-21.0.13+9 已被删除。
org.gradle.java.home=D:/jdk21/jdk-21.0.13+9
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# pub 缓存在 D 盘、项目在 E 盘，Kotlin 增量编译缓存跨盘符会崩（different roots），关闭增量
kotlin.incremental=false
# Kotlin 编译守护进程单独限内存，避免再吃一个 8G 上限
kotlin.daemon.jvmargs=-Xmx2G
