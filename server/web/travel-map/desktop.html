<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行迹 · 桌面端 — 会自己调速的旅行 Agent</title>
<!-- 真实地图底图引擎：MapLibre GL（矢量底图走本机 /travel-basemap 代理与磁盘缓存）。
     服务端 buildPageHtml 命中下面这两行时会把它们替换成 server/web/travel-map/vendor/
     的本地内联副本；vendor 缺失时保留 CDN 引用（弱网/离线由瓦片代理兜底）。 -->
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- 字体走设计稿同源 CDN（离线时自动回落到系统字体栈，不阻塞渲染）。
     另有 MapLibre 底图引擎外链（见下），服务端会把两者之外的资源都留在本机：
     底图瓦片/精灵/字形全部经 /travel-basemap 代理 + 磁盘缓存。 -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --win:#14151A; --side:#101115; --card:#1C1F27; --card2:#23262F;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --txt:#F3F1EC; --t2:#9BA0AA; --t3:#626873;
  --amber:#F5A552; --amber2:#D88434; --amberSoft:rgba(245,165,82,.13); --amberLine:rgba(245,165,82,.4);
  --jade:#63AAA1; --ok:#63C98C;
  --num:'Sora','Noto Sans SC',-apple-system,sans-serif;
  --cn:'Noto Sans SC','Sora',-apple-system,'PingFang SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#07080A;color:var(--txt);font-family:var(--cn);-webkit-font-smoothing:antialiased;
  overflow:hidden;
  background-image:radial-gradient(900px 600px at 20% 10%,rgba(245,165,82,.06),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(99,170,161,.05),transparent 60%);}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}

/* ===== 应用窗口（宿主为无边框系统窗口，面板自身铺满窗口） =====
   设计稿里的圆角/投影是「浮在桌面上的拟真窗口」展示壳；真实宿主窗口由系统
   提供边界（client/flutter_app 的行程独立窗口用 setAsFrameless），所以这里只
   保留窗内结构（标题栏 + 主体），去掉外壳圆角与投影。 */
.mac{width:100vw;height:100vh;background:var(--win);border-radius:0;
  display:flex;flex-direction:column;overflow:hidden}
.titlebar{height:42px;flex:0 0 auto;display:flex;align-items:center;padding:0 16px;
  background:rgba(28,30,37,.7);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);position:relative;z-index:5;
  -webkit-app-region:drag;cursor:default;user-select:none}
.traffic{display:flex;gap:8px;width:64px}
.traffic i{width:12px;height:12px;border-radius:50%;display:block;cursor:pointer}
.traffic i:nth-child(1){background:#FF5F57}.traffic i:nth-child(2){background:#FEBC2E}.traffic i:nth-child(3){background:#28C840}
.win-right{-webkit-app-region:no-drag}
.win-title{position:absolute;left:50%;transform:translateX(-50%);font-size:12.5px;color:var(--t2);font-weight:500;letter-spacing:.3px;
  display:flex;align-items:center;gap:8px}
.win-title .d{width:6px;height:6px;border-radius:50%;background:var(--amber);position:relative}
.win-title .d::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--amberLine);animation:ping 2.2s infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.win-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.win-right .wc{width:28px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--t3)}
.win-right .wc:hover{background:rgba(255,255,255,.06);color:var(--t2)}
.win-right .wc svg{width:13px;height:13px}

.body{flex:1;display:flex;min-height:0;position:relative}

/* ===== 左栏 ===== */
.sidebar{width:64px;flex:0 0 auto;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.side-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--t3);position:relative;transition:.18s}
.side-ic svg{width:19px;height:19px}
.side-ic:hover{color:var(--t2);background:rgba(255,255,255,.05)}
.side-ic.on{color:var(--amber);background:var(--amberSoft)}
.side-ic.on::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--amber)}
.side-spacer{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#F5A552,#D88434);display:grid;place-items:center;font-size:13px;font-weight:700;color:#201407}

/* ===== 主区 ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line);min-width:0;overflow:hidden}
/* 顶栏不重叠的三条约束：tb-left 整体不收缩（内部胶囊不可压，压了就叠到邻区）、
   时距条自己缩（band-meta 已带 ellipsis）、天气胶囊限宽（长句走 title 悬停） */
.tb-left{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:0}
.tb-city{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-family:var(--num);font-size:10.5px;color:var(--t3);letter-spacing:1.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-pill{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px;
  /* 多天行程（7 天常见）不能把旅程带挤没：胶囊条自身横向滚动，宽度封顶且不参与收缩 */
  flex:0 0 auto;max-width:min(330px,44vw);overflow-x:auto;scrollbar-width:none}
.day-pill::-webkit-scrollbar{display:none}
.day-pill button{padding:4px 12px;border-radius:999px;font-size:11.5px;color:var(--t2);min-height:26px;white-space:nowrap;flex:0 0 auto}
/* 多天行程（>4 天）胶囊收窄字号与内距，让 7 天能整排显示（设计稿 2 天口径不变） */
.day-pill.compact button{padding:4px 9px;font-size:11px}
.day-pill button.on{background:var(--txt);color:#15161A;font-weight:600}
.tb-band{flex:1 1 0;min-width:90px;overflow:hidden}
.band-meta{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;white-space:nowrap;overflow:hidden}
.band-meta .mood{color:var(--t2);overflow:hidden;text-overflow:ellipsis}.band-meta .mood b{color:var(--amber);font-weight:600}
.band-meta .end{font-family:var(--num);color:var(--t3);flex:0 0 auto;margin-left:10px}
.band{display:flex;gap:2px;height:6px;border-radius:99px}
.band i{height:100%;border-radius:99px;background:rgba(255,255,255,.1);cursor:pointer;transition:flex-grow .5s cubic-bezier(.3,.8,.3,1),background .25s;min-width:4px}
.band i.done{background:rgba(255,255,255,.2)}.band i.now{background:var(--amber);box-shadow:0 0 8px rgba(245,165,82,.6)}
.band i.alt{background:transparent;border:1px dashed rgba(255,255,255,.2);height:5px;align-self:center}
.tb-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.agent-chip{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--t2);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.agent-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.weather{font-family:var(--num);font-size:12px;color:var(--t2);display:flex;align-items:center;gap:5px;flex:0 0 auto;max-width:210px;white-space:nowrap;overflow:hidden}
.dq-chip{font-size:11px;color:var(--amber);background:var(--amberSoft);border:1px solid var(--amberLine);padding:5px 10px;border-radius:999px;white-space:nowrap}
.weather svg{width:14px;height:14px;color:var(--amber)}

/* ===== 内容区 ===== */
.content{flex:1;position:relative;min-height:0;display:flex}
.view{position:absolute;inset:0;display:flex;padding:20px;gap:18px;min-height:0}
.view-map{display:none;background:var(--win)}
/* z-index 必须高于「今日」视图内的浮层（.now-big/.now-tag 为 z-index:2，
   而两个 .view 都是 z-index:auto 的 absolute —— 不给地图层抬层级时，
   Now 卡的大标题会穿透到地图上面）。 */
.view-map.open{display:flex;z-index:4}

/* 当前站大卡 */
.now-photo{flex:0 0 44%;border-radius:16px;overflow:hidden;position:relative;min-height:0}
.now-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,12,14,0) 50%,rgba(11,12,14,.7))}
/* 无实拍图时的兜底：不闪占位框，走同族深青渐变（真实行程缺图常见） */
.now-photo.noimg{background:linear-gradient(150deg,#14323C,#0A151B 70%)}
.now-photo.noimg img{opacity:0}
.now-tag{position:absolute;top:14px;left:14px;z-index:2;font-size:10.5px;letter-spacing:1px;background:rgba(11,12,14,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);padding:5px 11px;border-radius:999px}
.now-book{position:absolute;top:14px;right:14px;z-index:2;display:flex;align-items:center;gap:6px;font-size:10.5px;background:rgba(11,12,14,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);padding:5px 11px;border-radius:999px}
.now-book .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.now-big{position:absolute;left:20px;right:20px;bottom:18px;z-index:2}
.now-time{font-family:var(--num);font-size:12px;color:var(--amber);letter-spacing:1px;font-weight:600}
.now-name{font-size:27px;font-weight:700;margin-top:3px;line-height:1.25}

.now-info{flex:1;display:flex;flex-direction:column;min-width:0}
.now-note{font-size:13.5px;color:var(--t2);line-height:1.7;margin-top:4px}
.stay-row{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:12px;color:var(--t2);font-family:var(--num)}
.stay-row svg{width:15px;height:15px;color:var(--amber)}
.stay-bar{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.stay-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber2),var(--amber));border-radius:4px;transition:width .5s}
/* 节奏反馈按钮（慢一点/还能逛）与底部「下一站/前往」条已整体移交手机端：
   桌面端定位 = 规划 + 全程展示，不做旅行过程引导（2026-10-12）。 */

/* Agent 气泡 */
.bubble{position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:20;
  max-width:560px;background:linear-gradient(120deg,rgba(245,165,82,.13),rgba(245,165,82,.03));
  border:1px solid rgba(245,165,82,.24);border-radius:14px;padding:12px 16px;display:none;gap:11px;
  box-shadow:0 20px 50px -18px rgba(0,0,0,.7);animation:rise .35s ease}
.bubble.show{display:flex}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(-14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.bubble .bic{width:26px;height:26px;border-radius:8px;background:var(--amberSoft);display:grid;place-items:center;flex:0 0 auto}
.bubble .bic svg{width:15px;height:15px;color:var(--amber)}
.bubble p{font-size:12.5px;line-height:1.65;color:var(--t2);flex:1}
.bubble p b{color:var(--txt);font-weight:600}
.bubble .undo{flex:0 0 auto;align-self:center;color:var(--amber);font-size:11.5px;border:1px solid var(--amberLine);padding:5px 12px;border-radius:999px;white-space:nowrap}

/* 地图视图（真实底图 MapLibre；底图瓦片走本机 /travel-basemap 代理 + 磁盘缓存） */
.map-wrap{flex:1;border-radius:14px;overflow:hidden;position:relative;background:#0D0F13}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{display:none!important}
.maplibregl-canvas:focus{outline:none}
.map-back{position:absolute;top:14px;left:14px;z-index:5;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);background:rgba(16,17,21,.75);backdrop-filter:blur(10px);border:1px solid var(--line2);padding:8px 14px;border-radius:999px}
.map-back svg{width:14px;height:14px}
/* 目的地水印：复刻设计稿的 alab（原示意底图上的「西 子 湖 面」）。
   真实底图上线后它更重要——一屏深色地图上看不出「这是哪」，水印直接给答案。 */
.map-mark{position:absolute;left:22px;bottom:18px;z-index:4;pointer-events:none;
  font-size:25px;font-weight:700;letter-spacing:6px;color:rgba(255,255,255,.10);
  text-shadow:0 2px 16px rgba(0,0,0,.65);white-space:nowrap}
.map-mark span{font-size:13px;letter-spacing:3px;color:rgba(245,165,82,.32);margin-left:8px}
/* 冷启动（首拉矢量样式/瓦片）占位：避免几秒纯黑，也避免被误读成"界面挂了" */
.map-loading{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:#0D0F13;
  color:var(--t3);font-size:12.5px;letter-spacing:.4px;transition:opacity .45s}
.map-loading.off{opacity:0;pointer-events:none}
/* 路线概览（真实距离/时长/数据来源；算不出来时整枚隐藏，不编造） */
.map-legend{position:absolute;top:14px;right:14px;z-index:5;display:none;align-items:center;gap:9px;
  font-family:var(--num);font-size:11.5px;color:var(--t2);background:rgba(16,17,21,.78);backdrop-filter:blur(10px);
  border:1px solid var(--line2);padding:8px 13px;border-radius:999px}
.map-legend.on{display:flex}
.map-legend b{color:var(--txt);font-weight:600}
.map-legend .sep{width:1px;height:11px;background:var(--line2)}
.map-legend .warn{color:var(--amber)}
/* 地图上的站点标记（MapLibre Marker 的 DOM）。
   注意：marker 元素由 MapLibre 用 transform 定位，**不要**给它设 position——
   覆盖成 relative 会让它脱离 marker 定位流、把内部绝对定位的标签甩飞。
   所以锚点盒保持 0×0，全部内容放进内层 .wrap，靠 translate(-11,-11) 让
   22px 圆点（半径 11）的圆心正好落在坐标点上。 */
.poi{width:0;height:0}
.poi .wrap{position:absolute;left:0;top:0;display:flex;align-items:center;
  transform:translate(-11px,-11px);cursor:pointer}
.poi .pin{width:22px;height:22px;border-radius:50%;background:var(--card2);border:1.6px solid var(--amberLine);
  color:var(--t2);font-family:var(--num);font-size:11px;font-weight:600;display:grid;place-items:center;
  transition:.2s;flex:0 0 auto}
.poi .lb{margin-left:7px;font-size:11.5px;color:var(--t2);white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 9px rgba(0,0,0,.85);pointer-events:none}
.poi.now{z-index:3}
.poi.now .pin{background:var(--amber);border-color:var(--amber);color:#201407;box-shadow:0 0 0 5px rgba(245,165,82,.18)}
.poi.now .lb{color:var(--amber);font-weight:700}
.poi.done{opacity:.5}
.poi.done .pin{border-color:rgba(255,255,255,.18)}
.poi.rest .pin{border-style:dashed;border-color:var(--jade)}
.poi.stay .pin{border-radius:7px}
.poi .pulse{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--amber);display:none}
.poi.now .pulse{display:block;animation:ping 1.8s infinite}

/* ===== 右栏：与主区并排的双面板（今日安排） =====
   占布局列、不悬浮覆盖内容；收缩按钮在面板头部，收起后宽度归零，
   右上角留一枚浮标（rb-fab）唤回。 */
.rightbar{width:264px;flex:0 0 auto;background:var(--side);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .3s,opacity .28s}
.rightbar.collapsed{width:0;border:none;opacity:0;pointer-events:none}
.rb-head{padding:14px 12px 10px 16px;display:flex;align-items:center}
.rb-head h3{font-size:13px;font-weight:600}
.rb-head .cnt{font-family:var(--num);font-size:10.5px;color:var(--t3);margin-left:auto;margin-right:8px}
.rb-collapse{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--t3);flex:0 0 auto}
.rb-collapse:hover{color:var(--t2);background:rgba(255,255,255,.06)}
.rb-collapse svg{width:14px;height:14px}
.rb-fab{position:absolute;top:10px;right:10px;z-index:6;display:none;align-items:center;gap:7px;
  font-size:12px;color:var(--txt);background:rgba(16,17,21,.85);backdrop-filter:blur(10px);
  border:1px solid var(--line2);padding:8px 14px;border-radius:999px;cursor:pointer}
.rb-fab.on{display:flex}
.rb-fab:hover{border-color:var(--amberLine)}
.rb-fab svg{width:14px;height:14px;color:var(--amber)}
.rb-fab .cnt{font-family:var(--num);font-size:10.5px;color:var(--t3)}
.rb-list{flex:1;overflow-y:auto;padding:0 10px 10px}
.rb-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer;transition:.15s}
.rb-row:hover{background:rgba(255,255,255,.04)}
.rb-row.now{background:var(--amberSoft);border:1px solid var(--amberLine)}
.rb-row.done{opacity:.45}
.rb-time{font-family:var(--num);font-size:11px;color:var(--t3);width:42px;text-align:right;flex:0 0 auto}
.rb-row.now .rb-time{color:var(--amber)}
.rb-dot{width:8px;height:8px;border-radius:50%;background:var(--amberLine);flex:0 0 auto;position:relative}
.rb-row.now .rb-dot{background:var(--amber);box-shadow:0 0 0 4px var(--amberSoft)}
.rb-row.done .rb-dot{background:rgba(255,255,255,.2)}
.rb-main{flex:1;min-width:0}
.rb-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-sub{font-size:10px;color:var(--t3);font-family:var(--num);margin-top:1px}
.rb-tag{font-size:9.5px;color:var(--t3);border:1px solid var(--line);padding:2px 6px;border-radius:5px;flex:0 0 auto}
.rb-alt{margin:6px 10px 10px;border:1px dashed var(--line2);border-radius:11px;padding:11px 12px}
.rb-alt .ah{font-size:10px;color:var(--t3);letter-spacing:1px;margin-bottom:8px}
.rb-alt-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.rb-alt-item .nm{font-size:12px;color:var(--t2)}
.rb-alt-item button{font-size:10.5px;color:var(--amber);border:1px solid var(--amberLine);padding:4px 10px;border-radius:999px}
/* 实时信号演示按钮（比计划慢了/下起雨了…）随过程功能一并移交手机端 */

#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:100;
  background:#23262E;border:1px solid var(--line2);font-size:12.5px;padding:10px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.28s;white-space:nowrap;box-shadow:0 20px 50px -15px rgba(0,0,0,.7)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.05s!important}}
</style>
</head>
<body>
<div class="mac">
  <!-- 标题栏（无边框窗口的自绘标题栏：左三色按钮 = 关闭/最小化/最大化，
       空白处按住可拖动窗口；右侧三枚为同义图标入口） -->
  <div class="titlebar" id="titlebar">
    <div class="traffic" id="trafficLights">

var state={day:1,pace:0,event:null,cur:2,prev:null,forceShow:{},view:'now'};
/* 演示数据模式下沿用设计稿的显式收起口径（boat/sudi/jiuxi）；
   真实载荷模式按站的通用属性判（ride 水上交通 / 天气敏感词 / 高耗体力），不认死 id。
   两档都保证「至少留一站」：全收起等于当天没行程，宁可留一站让人自己决定。 */
var DEMO_MODE=true;
var WEATHER_SENSITIVE_RE=/游船|出海|浮潜|潜水|海钓|观鲸|巡航|登岛|日落|日出|徒步|溯溪|漂流|沙滩|海滩/;
function rainHides(id,sp){

}
function tiredHides(id,sp){
  if(DEMO_MODE)return id==='sudi'||id==='jiuxi';

function effPace(){return state.pace+(state.event==='tired'?-1:0)+(state.event==='behind'?1:0);}

    if(sp.optional){show=(ev==='rain')||state.forceShow[id]||(ep>=1);}
    if(ev==='rain'&&rainHides(id,sp))show=false;
    if(ev==='tired'&&tiredHides(id,sp))show=false;
    if(show)visible.push(id);else alts.push(id);

  if(!visible.length&&order.length){
    visible.push(order[0]);
    alts=alts.filter(function(x){return x!==order[0];});
  }
  var items=[],cur=dayStart();
  for(var i=0;i<visible.length;i++){
    var id=visible[i],sp=S[id],dur;
    if(sp.k==='stay')dur=sp.base;
    else if(sp.rest)dur=clamp(Math.round(sp.base-ep*12),15,70);
    else if(sp.anchor)dur=sp.base;
    else{dur=sp.base-ep*8;if(ev==='behind')dur*=0.85;dur=clamp(Math.round(dur),sp.base*0.5,sp.base*1.5);}
    var next=visible[i+1],edge=null;

      picked:sp.optional&&(ep>=1||ev==='rain'||state.forceShow[id]),rest:!!sp.rest});

function minDur(it){if(it.sp.k==='stay'||it.sp.anchor)return it.sp.base;if(it.sp.rest)return 15;return Math.round(it.sp.base*0.5);}
function compressible(it){return !it.sp.anchor&&it.sp.k!=='stay'&&!it.sp.rest;}
function finalize(items,dayStartMin){
  var base=dayStartMin==null?540:dayStartMin;
  var lastEnd=base,segStart=0;
  for(var i=0;i<items.length;i++){var it=items[i];
    if(it.sp.anchor){
      var prev=items[segStart-1],lead=(prev&&prev.edge)?prev.edge[1]:0;
      var avail=it.sp.anchor-lastEnd-lead,seg=items.slice(segStart,i),need=0;
      seg.forEach(function(x){need+=x.dur+(x.edge?x.edge[1]:0);});

    }

function compactWeather(t){
  var tm=/(-?\d+(?:\.\d+)?)\s*°?\s*C/i.exec(t);
  var m=/晴|多云|阴|阵雨|雷雨|暴雨|大雨|中雨|小雨|毛毛雨|雨夹雪|小雪|中雪|大雪|冻雨|雾|霾|沙尘/.exec(t);

/* ═══════════════════════════════════════════════════════════════════
   真实地图（MapLibre GL）
   ═══════════════════════════════════════════════════════════════════
   底图：Carto 暗色矢量，走本机 /travel-basemap 代理（磁盘缓存 + 规划完成即预热）。
   站点：当天行程 POI 按真实经纬度落点（编号 + 名称，点击切站）。
   路线：GET /travel-route（OSRM 开放路网，按段选步行/骑行/驾车）取真实几何；
        首次打开该天时白线「依次连接」——逐段生长，连完转流光。
   降级：无坐标的站不上图；某段取不到路网几何 → 该段用直线连并在图例里明示
        「N 段未接路网」，不静默丢段、不假装是真路。 */
var MAP_STYLE_PATH='/travel-basemap/style/dark';
var MAP_STYLE_FALLBACK='https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
var ROUTE_SRC='travel-route';
var LEG_SRC='travel-leg';
var DASH_SEQ=[[0,4,3],[.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],[2.5,4,.5],[3,4,0],
  [0,.5,3,3.5],[0,1,3,3],[0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],[0,3.5,3,.5]];
var mapState={map:null,loading:false,ready:false,markers:[],poisKey:'',routeKey:'',
  played:{},raf:0,tick:0,flowTick:0,center:null};
var MODE_OF_PROFILE={walk:'walk',bike:'bike',drive:'taxi'};

function emptyFC(){return{type:'FeatureCollection',features:[]};}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mapStyleUrl(){
  var base=apiBase();
  return base?base+MAP_STYLE_PATH:MAP_STYLE_FALLBACK;
}
/** 底图调色（只改 paint/layout，不动几何与数据）。
 *
 * Carto dark-matter 的水域是 #2C353C、陆地是 #0e0e0e —— 两个深色贴在一起，
 * 西湖这种大水面在屏幕上就是"一片黑"，看不出是在湖边；湖名在 z13 只有 9px
 * 灰字，读数接近于无。行程地图的第一职责是让人一眼认出"这是哪"，所以：
 * 水域提成偏青的湖色（与页面 jade 令牌同族）、湖名放大提亮、社区名压暗退后。 */
function tuneBasemap(map){
  var setP=function(id,prop,val){try{if(map.getLayer(id))map.setPaintProperty(id,prop,val);}catch(e){/* 样式版本差异：忽略 */}};
  var setL=function(id,prop,val){try{if(map.getLayer(id))map.setLayoutProperty(id,prop,val);}catch(e){/* ignore */}};
  // 水：深灰蓝 → 湖青；水岸留一圈更深的影，边界更清楚
  setP('water','fill-color','#17414F');
  setP('water_shadow','fill-color','#07161C');
  // 湖名/水域名：z13 从 9px 提到 15px，颜色提到可读、描边压深保证压在任何底上都能读
  setL('watername_lake','text-size',['interpolate',['linear'],['zoom'],8,10,12,13,13,15,16,17]);
  setP('watername_lake','text-color','rgba(168,206,216,1)');
  setP('watername_lake','text-halo-color','#05202A');
  setP('watername_lake','text-halo-width',1.6);
  setL('watername_lake_line','text-size',['interpolate',['linear'],['zoom'],8,10,12,12,13,14,16,16]);
  setP('watername_lake_line','text-color','rgba(132,170,182,1)');
  setP('watername_lake_line','text-halo-color','#05202A');
  setP('watername_lake_line','text-halo-width',1.4);
  // 社区/郊区名：略压暗，把注意力让给站点标签与湖名
  setP('place_suburbs','text-color','rgba(118,124,134,1)');
  // 中文行程配中文地名：Carto 默认按 zoom 切字段（z<13 用 {name_en}），于是
  // 低 zoom 下整张图是 XINGYI / Pingdong / Zerong 这类拉丁文，跟行程里的地点名
  // 对不上。这里把「地名/水域名/路名」三类图层的字段统一成本地名优先
  // （name → name_zh → name_en），其余图层（housenumber/poi 等）不动，避免错取字段。
  var CN_NAME_FIELD=['coalesce',['get','name'],['get','name_zh'],['get','name_en']];
  var layers=(map.getStyle()||{}).layers||[];
  layers.forEach(function(l){
    if(l.type!=='symbol')return;
    if(!/^(place_|watername_|roadname_)/.test(l.id))return;
    try{map.setLayoutProperty(l.id,'text-field',CN_NAME_FIELD);}catch(e){/* ignore */}
  });
}
/** 地图容器可见后再初始化：.view-map 未展开时容器尺寸为 0，MapLibre 会把视口算错。 */
function ensureMap(cb){
  if(mapState.map){cb&&cb();return;}
  if(mapState.loading)return;
  if(!window.maplibregl){console.warn('[map] MapLibre 未加载');return;}
  mapState.loading=true;
  var c=mapState.center?[mapState.center.lng,mapState.center.lat]:[100.1595,25.6904];
  var map=new maplibregl.Map({
    container:$('map'),style:mapStyleUrl(),
    center:c,zoom:mapState.center?12:11,
    attributionControl:false,dragRotate:false,pitchWithRotate:false
  });
  mapState.map=map;
  map.on('load',function(){
    mapState.ready=true;mapState.loading=false;
    tuneBasemap(map);
    addRouteLayers();
    if(state.view==='map')renderMap(replan().items);
    cb&&cb();
    // 占位要在「首屏瓦片真的画出来」之后撤：`load` 只代表样式就绪，
    // 此时底图仍是黑的。idle 在所有可见瓦片到位后触发，离线时用超时兜底。
    var off=function(){var ld=$('mapLoading');if(ld)ld.classList.add('off');};
    map.once('idle',off);
    setTimeout(off,9000);
  });
  map.on('error',function(e){console.warn('[map]',e&&e.error&&e.error.message);});
}
/** 路线图层组：轨道（未连接）/ 已连接白线 + 外发光 / 直线降级 / 生长中的当前段 / 流光 */
function addRouteLayers(){
  var map=mapState.map;
  if(!map||map.getSource(ROUTE_SRC))return;
  map.addSource(ROUTE_SRC,{type:'geojson',data:emptyFC()});
  map.addSource(LEG_SRC,{type:'geojson',data:emptyFC()});
  var cap={ 'line-cap':'round','line-join':'round' };
  map.addLayer({id:'route-track',type:'line',source:ROUTE_SRC,
    filter:['==',['get','state'],'todo'],layout:cap,
    paint:{'line-color':'#ffffff','line-width':1.6,'line-opacity':.15,'line-dasharray':[1.2,2.2]}});
  map.addLayer({id:'route-glow',type:'line',source:ROUTE_SRC,
    filter:['==',['get','state'],'linked'],layout:cap,
    paint:{'line-color':'#ffffff','line-width':14,'line-opacity':.10,'line-blur':7}});
  map.addLayer({id:'route-line',type:'line',source:ROUTE_SRC,
    filter:['==',['get','state'],'linked'],layout:cap,
    paint:{'line-color':'#ffffff','line-width':3.4,'line-opacity':.97}});
  // 直线降级段：细虚线，与真实路网一眼可分
  map.addLayer({id:'route-straight',type:'line',source:ROUTE_SRC,
    filter:['all',['==',['get','state'],'linked'],['==',['get','real'],false]],layout:cap,
    paint:{'line-color':'#ffffff','line-width':2,'line-opacity':.62,'line-dasharray':[1,2.4]}});
  map.addLayer({id:'route-leg',type:'line',source:LEG_SRC,layout:cap,
    paint:{'line-color':'#ffffff','line-width':3.4,'line-opacity':1}});
  // 连完后的流光：白虚线循环推进（复刻旧行程页的流光语言）
  map.addLayer({id:'route-flow',type:'line',source:ROUTE_SRC,
    filter:['==',['get','state'],'linked'],layout:cap,
    paint:{'line-color':'#ffffff','line-width':2.2,'line-opacity':0,'line-dasharray':DASH_SEQ[0]}});
}
function updateFlow(on){
  var map=mapState.map;
  if(mapState.flowTick){clearInterval(mapState.flowTick);mapState.flowTick=0;}
  if(!map)return;
  try{map.setPaintProperty('route-flow','line-opacity',on?.85:0);}catch(e){/* 图层未就绪 */}
  if(!on)return;
  var idx=0;
  mapState.flowTick=setInterval(function(){
    var m=mapState.map;
    if(!m||!m.getLayer('route-flow'))return;
    idx=(idx+1)%DASH_SEQ.length;
    try{m.setPaintProperty('route-flow','line-dasharray',DASH_SEQ[idx]);}catch(e){/* ignore */}
  },90);
}
function clearAnim(){
  if(mapState.raf){cancelAnimationFrame(mapState.raf);mapState.raf=0;}
  if(mapState.tick){clearTimeout(mapState.tick);mapState.tick=0;}
  var src=mapState.map&&mapState.map.getSource(LEG_SRC);
  if(src)src.setData(emptyFC());
}
/* ── 站点标记 ── */
function poiEl(it,i,num){
  var d=document.createElement('div');
  var cls=[];
  if(i===state.cur)cls.push('now');else if(i<state.cur)cls.push('done');

  d.addEventListener('mousedown',function(e){e.stopPropagation();});
  d.addEventListener('click',function(e){e.stopPropagation();setCur(i);});
  return d;
}
function renderMapPois(items){
  var map=mapState.map;
  mapState.markers.forEach(function(m){try{m.remove();}catch(e){/* ignore */}});
  mapState.markers=[];

function updatePoiActive(){

    var el=m.getElement(),i=+el.dataset.i;

    el.classList.toggle('done',i<state.cur);

/* ── 路线：几何构建 + 依次连接动画 ── */
function seqOf(items){
  var out=[];
  items.forEach(function(it,i){if(it.sp.loc)out.push({lat:it.sp.loc.lat,lng:it.sp.loc.lng,itemIndex:i});});
  return out;
}
function planar(a,b){
  var dx=(b[0]-a[0])*Math.cos((a[1]+b[1])*Math.PI/360),dy=b[1]-a[1];
  return Math.sqrt(dx*dx+dy*dy);
}
/** 按累计长度比例截断（生长动画的一帧）；少于两点时补一个点保证可绘 */
function sliceAt(coords,ratio){
  if(ratio<=0)return[];
  if(ratio>=1)return coords.slice();
  var segs=[],total=0,i,d;
  for(i=0;i+1<coords.length;i++){d=planar(coords[i],coords[i+1]);segs.push(d);total+=d;}
  if(!total)return coords.slice(0,Math.max(2,Math.ceil(coords.length*ratio)));
  var need=total*ratio,out=[coords[0]];
  for(i=0;i<segs.length;i++){
    if(need<=0)break;
    if(need<segs[i]){
      var t=need/segs[i];
      out.push([coords[i][0]+(coords[i+1][0]-coords[i][0])*t,coords[i][1]+(coords[i+1][1]-coords[i][1])*t]);
      need=0;break;
    }
    need-=segs[i];out.push(coords[i+1]);
  }
  return out.length>=2?out:[coords[0],coords[1]];
}
function legsByIndex(list){
  var by={};(list||[]).forEach(function(l){by[l.index]=l;});return by;
}
/** 提交「前 linkedCount 段已连接」的路网形态（其余为暗轨道） */
function commitRoute(seq,by,linkedCount){
  var map=mapState.map;
  if(!map||!map.getSource(ROUTE_SRC))return;
  var features=[];
  for(var i=0;i+1<seq.length;i++){
    var leg=by[i],real=!!leg;
    var geom=real?leg.coordinates:[[seq[i].lng,seq[i].lat],[seq[i+1].lng,seq[i+1].lat]];
    features.push({type:'Feature',
      properties:{state:i<linkedCount?'linked':'todo',real:real,mode:real?leg.mode:'straight'},
      geometry:{type:'LineString',coordinates:geom}});
  }
  map.getSource(ROUTE_SRC).setData({type:'FeatureCollection',features:features});
}
/** 单段生长：按 ~16ms 一帧逐帧截断几何（MapLibre GL 没有 line-dashoffset，
    逐帧 setData 是兼容性最好的生长实现，段短、帧数少，开销可忽略）。 */
function growLeg(coords,done){
  var src=mapState.map&&mapState.map.getSource(LEG_SRC);
  if(!src){done();return;}
  var dur=clamp(coords.length*13,240,860);
  var steps=Math.max(6,Math.round(dur/16)),n=0;
  (function frame(){
    n++;
    var r=Math.min(1,n/steps);
    src.setData({type:'FeatureCollection',features:[
      {type:'Feature',properties:{},geometry:{type:'LineString',coordinates:sliceAt(coords,r)}}]});
    if(r<1){mapState.raf=requestAnimationFrame(frame);}
    else{mapState.raf=0;done();}
  })();
}
function fitToSeq(seq,animate){
  var map=mapState.map;
  if(!map)return;
  var opts={duration:animate===false?0:650};
  // 没有任何可用站点坐标：退回载荷给的行程中心（目的地），别停在一个不相干的地方
  if(!seq||!seq.length){
    if(mapState.center)map.easeTo({center:[mapState.center.lng,mapState.center.lat],zoom:12,duration:opts.duration});
    return;
  }
  if(seq.length===1){
    map.easeTo({center:[seq[0].lng,seq[0].lat],zoom:14.5,duration:opts.duration});
    return;
  }
  var b=new maplibregl.LngLatBounds();
  seq.forEach(function(p){b.extend([p.lng,p.lat]);});
  map.fitBounds(b,{padding:{top:70,bottom:70,left:120,right:170},
    duration:opts.duration,maxZoom:15.5});

/** 真实腿回填：底部「下一站」与右栏的交通耗时换成路网实测，而不是 haversine 估算 */
function applyRealLegs(items,by,seq){
  for(var i=0;i+1<seq.length;i++){
    var a=seq[i],b=seq[i+1];
    if(b.itemIndex!==a.itemIndex+1)continue;        // 中间夹着无坐标的站：不硬接
    var leg=by[i];if(!leg)continue;
    var idA=items[a.itemIndex].id,idB=items[b.itemIndex].id;
    var mode=MODE_OF_PROFILE[leg.mode]||'walk';
    var dist=leg.distanceKm<1?Math.round(leg.distanceKm*1000)+'m':leg.distanceKm.toFixed(1)+'km';
    EDGE[idA+'->'+idB]=[mode,leg.durationMin,dist+' · 路网'];
  }
}
function updateLegend(list,total){
  var el=$('mapLegend');
  if(!el)return;
  if(!list||!list.length){el.className='map-legend';el.innerHTML='';return;}
  var km=0,min=0;
  list.forEach(function(l){km+=Number(l.distanceKm)||0;min+=Number(l.durationMin)||0;});
  var missing=(total||0)-list.length;
  el.innerHTML='<span>当天路线</span><span class="sep"></span><b>'+km.toFixed(1)+' km</b>'+
    '<span class="sep"></span><b>'+t2s(min)+'</b><span class="sep"></span>'+
    (missing>0?'<span class="warn">'+missing+' 段未接路网 · 按直线</span>':'<span>真实路网 · OSM</span>');
  el.className='map-legend on';
}
/** 取当天真实路网（带同日去重：切天/切站不重复打外网） */
function loadDayRoute(items,seq){
  if(!seq||seq.length<2){commitRoute(seq||[],{},0);updateLegend([],0);return;}
  var key=state.day+'|'+seq.map(function(l){return l.lat.toFixed(4)+','+l.lng.toFixed(4);}).join(';');
  if(mapState.routeKey===key)return;
  mapState.routeKey=key;
  var base=apiBase();
  if(!base){playRoute(items,seq,[],key);return;}
  var qs='stops='+seq.map(function(l){return l.lat+','+l.lng;}).join(';');
  fetch(base+'/travel-route?'+qs,{headers:{Accept:'application/json'}})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(mapState.routeKey!==key)return;   // 用户已切天：丢弃迟到结果
      playRoute(items,seq,(j&&j.legs)||[],key);
    })
    .catch(function(){if(mapState.routeKey===key)playRoute(items,seq,[],key);});
}
/** 首次打开该天：白线依次连接（逐段生长）；再看已播过则直接落线 + 流光。 */
function playRoute(items,seq,list,key){
  var by=legsByIndex(list);
  clearAnim();
  updateFlow(false);
  commitRoute(seq,by,0);
  updateLegend(list,seq.length-1);
  applyRealLegs(items,by,seq);
  // 真实腿回填后刷新「下一站/右栏」的交通文案（此前是 haversine 估算，
  // 与地图上的真实路网对不上）。render 内部会再看一次地图，但 routeKey
  // 未变 → loadDayRoute 直接返回，不会重复打外网。
  if(seq.length>1)render();
  if(mapState.played[key]){
    commitRoute(seq,by,seq.length-1);
    updateFlow(true);
    return;
  }
  mapState.played[key]=true;
  // 起手留一拍：等视野定位的 ease 动画走完（~650ms）再开始连接，
  // 否则「地图在缩放的同时线在长」，两头都看不清。
  var i=0;
  function nextLeg(){
    if(i>=seq.length-1){commitRoute(seq,by,seq.length-1);updateFlow(true);return;}
    var leg=by[i];
    var coords=leg?leg.coordinates:[[seq[i].lng,seq[i].lat],[seq[i+1].lng,seq[i+1].lat]];
    growLeg(coords,function(){
      i++;
      commitRoute(seq,by,i);
      mapState.tick=setTimeout(nextLeg,140);
    });
  }
  mapState.tick=setTimeout(nextLeg,700);
}
/** 目的地水印：一屏深色地图上让人立刻知道「这是哪」（复刻设计稿的 alab）。 */

/* ── 照片预加载：进窗口就 warm 当前天全部站点的图，切站零等待 ──
   此前的口径是「切到哪站才加载哪站」：有图的站等一次冷 HTTP，没图的站还要
   先请求 /travel-poi/details 补图再加载 —— 用户进窗口先看白底渐变。
   现在 loadPlan/render 即把当前天全部站点图推进预加载队列（当前站最优先，
   其余天在切天时再预热）；并发上限 4，不挤占底图瓦片与接口带宽。 */
var preloaded={},preloadQueue=[],preloadActive=0;
function pumpPreload(){
  while(preloadActive<4&&preloadQueue.length){
    var u=preloadQueue.shift();
    if(!u||preloaded[u])continue;
    preloaded[u]=1;preloadActive++;
    var im=new Image();
    im.onload=im.onerror=function(){preloadActive--;pumpPreload();};
    im.src=u;
  }
}
function enqueuePreload(urls){
  for(var i=0;i<(urls||[]).length;i++)preloadQueue.push(urls[i]);
  pumpPreload();
}
function preloadDayAssets(dayKey){

  });
  enqueuePreload(here.concat(later));

/* ── 载荷适配：真实行程（days[].entries[]）→ 本页数据模型（S/ORDER/EDGE/DAYNAME） ── */
/** 兼容两种载荷形态：宿主桥注入的 entries 形态，与行程仓库的 items 形态
    （仓库字段 startTime/visitDuration/items → 统一成 entries 形态，与 mobile.html 同规则）。 */
function normalizePlan(raw){
  raw=raw||{};
  var days=raw.days||[];
  if(!days.length||!days[0]||!days[0].items)return raw;
  return{
    destination:str(raw.destination),title:str(raw.title),center:raw.center||null,
    days:days.map(function(d,i){
      return{
        label:str(d.date)||('Day '+(i+1)),
        subtitle:str(d.subtitle)||str(d.name),
        entries:(d.items||[]).map(function(it){
          return{
            name:str(it.name),type:str(it.type),time:str(it.startTime),
            duration:Number(it.visitDuration)||0,
            description:str(it.description),priceInfo:str(it.priceInfo),
            tips:Array.isArray(it.tips)?it.tips:[],
            address:str(it.address),images:Array.isArray(it.images)?it.images:[],
            latitude:it.latitude,longitude:it.longitude,
            optional:it.type==='optional'

        })

    })

var KIND_BY_TYPE={attraction:'sight',restaurant:'food',hotel:'stay',transport:'ride',shopping:'sight',other:'sight',indoor:'indoor'};
var TAG_BY_TYPE={attraction:'景点',restaurant:'餐饮',hotel:'住宿',transport:'交通',shopping:'逛街',indoor:'室内',other:'安排'};
var PERIOD_MIN={'凌晨':60,'清晨':360,'早上':420,'上午':540,'中午':720,'下午':840,'傍晚':1020,'晚上':1140,'夜里':1260};
var LEG_SPEED={walk:75,bike:220,taxi:400};
var OUTDOOR_RE=/湖|山|海|滩|岛|公园|景区|古镇|街|堤|塔|桥|徒步|骑行|日落|日出|游船|缆车|村|谷|湾|礁|岛礁/;
var HEAVY_RE=/徒步|登山|骑行|长堤|环湖|溯溪|漂流|攀/;

function str(v){return v==null?'':String(v);}
function pad2(n){return (10>n?'0':'')+n;}
function parseTime(t){
  var s=str(t).trim();
  if(!s)return null;
  var m=/(\d{1,2})\s*[:：]\s*(\d{2})\s*[-~—－至]\s*(\d{1,2})\s*[:：]\s*(\d{2})/.exec(s);
  if(m)return{start:(+m[1])*60+(+m[2]),end:(+m[3])*60+(+m[4])};
  m=/T\s*(\d{1,2})\s*[:：]\s*(\d{2})/.exec(s);
  if(m)return{start:(+m[1])*60+(+m[2]),end:null};
  m=/^(\d{1,2})\s*[:：]\s*(\d{2})/.exec(s);
  if(m)return{start:(+m[1])*60+(+m[2]),end:null};
  m=/^(\d{1,2})\s*点\s*(半|[0-5]?\d)?/.exec(s);
  if(m)return{start:(+m[1])*60+(m[2]==='半'?30:(m[2]?+m[2]:0)),end:null};
  for(var k in PERIOD_MIN){if(s.indexOf(k)>=0)return{start:PERIOD_MIN[k],end:null};}
  return null;

function haversineKm(a,b){
  if(!a||!b||a.lng==null||b.lng==null||a.lat==null||b.lat==null)return null;
  var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  var la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function estimateEdge(from,to){
  if(!from||!to||!from.loc||!to.loc)return['walk',8,'600m'];
  var km=haversineKm(from.loc,to.loc);
  if(km==null)return['walk',8,'600m'];
  var mode=km<1.2?'walk':(km<4?'bike':'taxi');
  var road=km*1.32;
  // 上限 180 分钟：跨岛/跨城这类长距离用「直线 × 系数 ÷ 市区车速」会算出十几小时，
  // 那是臆造的地理路径。缺口留给 Agent 侧回填 leg 字段，这里只给保守上限。
  var minutes=clamp(Math.round(road*1000/LEG_SPEED[mode]),3,180);
  return[mode,minutes,road<1?Math.round(road*1000)+'m':road.toFixed(1)+'km'];
}
/** 有效经纬度判定：(0,0) 是服务端「未知中心」的哨兵值（`center: knownCenter ?? {0,0}`），
    当成真实坐标会把地图甩到几内亚湾；越界值同样丢弃。 */
function validLatLng(lat,lng){
  var a=Number(lat),b=Number(lng);
  if(!isFinite(a)||!isFinite(b))return null;
  if(a===0&&b===0)return null;
  if(Math.abs(a)>90||Math.abs(b)>180)return null;
  return{lat:a,lng:b};
}
/** 原始 entry → 本页站点模型（S[id]）。anchor/duration 缺失一律不臆造。 */
function adaptStop(entry,dayKey,idx){
  var type=str(entry.type)||'attraction';
  var k=KIND_BY_TYPE[type]||'sight';
  var loc=validLatLng(entry.latitude,entry.longitude);
  var imgs=(entry.images||[]).filter(function(u){return u&&str(u).trim();});
  var range=parseTime(entry.time);
  var dur=Number(entry.duration)>0?Number(entry.duration):(range&&range.end!=null?Math.max(15,range.end-range.start):0);
  var isRest=/咖啡|茶|歇脚|休息/.test(str(entry.name)+str(entry.type));
  var text=str(entry.name)+' '+str(entry.description)+' '+str(entry.tips);
  // 备注：描述 → 价格 → 贴士（顿号串）→ 地址，全空才真正留白
  var note=str(entry.description);
  if(!note)note=str(entry.priceInfo);
  if(!note&&entry.tips&&entry.tips.length)note=entry.tips.filter(Boolean).join('；');
  if(!note)note=str(entry.address);
  return{id:'d'+dayKey+'e'+idx,n:str(entry.name)||'行程安排',k:k,tag:TAG_BY_TYPE[type]||'安排',
    img:imgs.length?str(imgs[0]):'',base:dur,xy:null,loc:loc,note:note,
    anchor:null,book:null,optional:!!entry.optional,rest:isRest&&k!=='stay',
    startHint:range?range.start:null,text:text,ride:k==='ride',
    outdoor:OUTDOOR_RE.test(text)&&k!=='indoor',heavy:HEAVY_RE.test(text)};
}
/** 停留时长补齐：有明确起止→用差值；否则用与下一站的时刻差；再否则 45 分兜底。 */
function fillDurations(stops){
  for(var i=0;i<stops.length;i++){
    var s=stops[i],next=stops[i+1];
    if(s.base>0)continue;
    if(next&&s.startHint!=null&&next.startHint!=null&&next.startHint>s.startHint){s.base=clamp(Math.round(next.startHint-s.startHint),15,240);continue;}
    s.base=45;

/** 完整载荷 → 本页数据模型。返回 false 表示载荷不可用（保留演示数据）。 */
function adaptPlan(raw){
  raw=normalizePlan(raw);
  var days=raw.days||[];
  if(!days.length)return false;
  var S2={},ORDER2={},EDGE2={},DAYNAME2={},START2={},DATES=[];
  days.forEach(function(day,di){

    fillDurations(stops);
    for(var i=1;i<stops.length;i++){
      EDGE2[stops[i-1].id+'->'+stops[i].id]=estimateEdge(stops[i-1],stops[i]);
    }
    ORDER2[key]=ids;
    // 天名：去掉「第 N 天」这类通用副标题（拿它当大标题等于复读天数），留空走
    // 顶栏回退链（目的地/行程名）；只有 Agent 侧给了真实线路名（如「西湖环湖线」）才显示
    var dayName=str(day.subtitle)||str(day.name);
    if(/^第\s*\d+\s*天$/.test(dayName.trim()))dayName='';
    DAYNAME2[key]=dayName;
    // 只认形如 09/12 · 2026-09-12 · 9.12 的日期文本。subtitle 与 label 都试
    // （Dart 载荷 label=日期、subtitle=「第 N 天」，只看 subtitle 会丢日期）
    var dateCands=[str(day.subtitle),str(day.label)];
    for(var di2=0;di2<dateCands.length;di2++){
      var dateText=dateCands[di2].trim();
      if(/^\d{1,4}[\/\-.]\d{1,2}([\/\-.]\d{1,2})?$/.test(dateText)){DATES.push(dateText);break;}
    }
    START2[key]=minStart!=null?minStart:540;
  });
  S=S2;ORDER=ORDER2;EDGE=EDGE2;DAYNAME=DAYNAME2;DAY_START=START2;
  var dest=str(raw.destination)||str(raw.title)||'行程';
  // 拉丁文目的地才拿来做「城市英文名」（中文名转大写只是复读，不如不显示）
  var en=/^[\x20-\x7E]+$/.test(dest)?dest.toUpperCase():'';
  META={city:dest,cityEn:en,days:days.length,dates:DATES,title:'行迹 · '+dest+' '+days.length+' 日',dq:str(raw.dataQuality)};
  WEATHER_TEXT=str(raw.weather);
  liveCache={};
  return true;
}

/* ── 桥 API（与 panel.html / mobile.html 同名，客户端桥逻辑复用） ── */
var HOST_MODE=!!(window.chrome&&window.chrome.webview)||/[?&]host=1/.test(location.search);
/** 宿主形态下载荷到达前不展示演示数据（避免被当成真实行程）。 */
var DATA_READY=!HOST_MODE;
/** 换载时把地图侧状态清干净：旧站的 marker / 路线 / 图例 / 播放记录都不能残留。 */
function resetMapState(){
  mapState.poisKey='';mapState.routeKey='';mapState.played={};
  clearAnim();updateFlow(false);
  mapState.markers.forEach(function(m){try{m.remove();}catch(e){/* ignore */}});
  mapState.markers=[];
  var src=mapState.map&&mapState.map.getSource(ROUTE_SRC);
  if(src)src.setData(emptyFC());
  var el=$('mapLegend');if(el){el.className='map-legend';el.innerHTML='';}
}
/** 提前让服务端把目的地底图落到磁盘缓存：用户还在「今日」视图的这几秒里，
    后台已把矢量样式/精灵/首屏瓦片备好，点开「路线」几乎瞬开（不再几秒黑屏）。
    只发坐标，不发整份载荷（体量小、语义清楚）。 */
function warmBasemap(raw){
  var base=apiBase();
  if(!base||!raw)return;
  var pois=[];
  (raw.days||[]).forEach(function(d){
    (d.entries||d.items||[]).forEach(function(e){
      var p=validLatLng(e.latitude,e.longitude);
      if(p)pois.push({latitude:p.lat,longitude:p.lng});
    });
  });
  var center=raw.center?validLatLng(raw.center.latitude,raw.center.longitude):null;
  if(!pois.length&&!center)return;
  try{
    fetch(base+'/travel-basemap/warm',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({center:center,days:[{entries:pois}]})
    }).catch(function(){/* 预热失败不影响主流程 */});
  }catch(e){/* fetch 不可用：忽略 */}
}
window.__travelPanel={
  loadPlan:function(payload){
    DEMO_MODE=!adaptPlan(payload);
    DATA_READY=true;
    state.day=1;state.cur=0;state.event=null;state.forceShow={};
    // 行程中心（目的地）：站点坐标缺失时靠它把底图定位到「对应的地点」，
    // 而不是停在一个不相干的默认点
    mapState.center=payload&&payload.center
      ?validLatLng(payload.center.latitude,payload.center.longitude):null;
    resetMapState();
    warmBasemap(payload);
    render();
  },
  /** Agent 侧感知结论（天气/步速/对话）：页面据此重排，并展示 Agent 的解释文案。 */
  applySignal:function(ev,note){
    state.prev=null;state.event=ev||null;state.pace=0;state.forceShow={};
    render();
    if(note)showBubble(note);
  },
  setTheme:function(){/* 行迹为固定深色设计令牌，保留 API 兼容 */},
  setTileProxy:function(base){TILE_BASE=String(base==null?'':base);},
  setDefaultCenter:function(){/* 地图中心随当天站点边界自适应，无需外部指定 */},
  showDay:function(i){var n=dayCount();state.day=clamp(Number(i)||1,1,n);state.cur=0;state.forceShow={};render();},
  openStop:function(id){
    var order=ORDER[state.day]||[],i=order.indexOf(id);
    if(i<0){state.forceShow[id]=true;commit();i=(replan().items.map(function(x){return x.id;}).indexOf(id));}
    if(i>=0){state.cur=i;render();}
  }
};
function dayCount(){return META&&META.days?META.days:1;}

/* ── 窗口控制（无边框窗口的自绘标题栏） ── */
function winAction(act){notifyHost({event:act});}
$('tlClose').addEventListener('click',function(){winAction('close');});
$('tlMin').addEventListener('click',function(){winAction('minimize');});
$('tlMax').addEventListener('click',function(){winAction('maximize');});
$('wcClose').addEventListener('click',function(){winAction('close');});
$('wcMin').addEventListener('click',function(){winAction('minimize');});
$('wcMax').addEventListener('click',function(){winAction('maximize');});
$('titlebar').addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  if(e.target.closest('.traffic')||e.target.closest('.win-right'))return;
  notifyHost({event:'windowDrag'});
});
$('titlebar').addEventListener('dblclick',function(e){
  if(e.target.closest('.traffic')||e.target.closest('.win-right'))return;
  notifyHost({event:'maximize'});
});

/* ══════════════════ 启动 ══════════════════ */
render();
// 窗口尺寸变化：MapLibre 需要显式 resize 才会重算画布与视口（不会自动跟随容器）
window.addEventListener('resize',function(){
  if(state.view==='map'&&mapState.map)mapState.map.resize();
});
notifyHost({event:'ready'});
</script>
