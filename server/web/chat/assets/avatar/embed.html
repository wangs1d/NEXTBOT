<!doctype html>
<html lang="zh-CN" class="embed-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Sphere - Chat Embed</title>
    <style>
      html.embed-root,
      html.embed-root body,
      html.embed-root #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      /* mini 模式：徽标内嵌，去掉最小尺寸与圆角，让 3D 球完整可见 */
      html.embed-root.is-mini,
      html.embed-root.is-mini body,
      html.embed-root.is-mini #root {
        min-width: 0 !important;
        min-height: 0 !important;
      }
      html.embed-root.is-mini .mode-embed {
        min-width: 0 !important;
        min-height: 0 !important;
        border-radius: 0 !important;
      }
      html.embed-root.is-mini .mode-embed-hint,
      html.embed-root.is-mini .task-feed,
      html.embed-root.is-mini .task-notification-hub,
      html.embed-root.is-mini .embed-drag-surface {
        display: none !important;
      }
    </style>
    <script>
      // 命中 ?mini=1 时给 <html> 加类，CSS 立即生效，避免首帧闪过完整 UI
      (function () {
        try {
          if (new URLSearchParams(window.location.search).get("mini") === "1") {
            document.documentElement.classList.add("is-mini");
          }
        } catch (_) {}
      })();
    </script>
    <script type="module" crossorigin src="/chat/assets/avatar/assets/embed-BN5crgPZ.js"></script>
    <link rel="modulepreload" crossorigin href="/chat/assets/avatar/assets/client-BQA3iFgX.js">
    <link rel="modulepreload" crossorigin href="/chat/assets/avatar/assets/useTaskEventStream-ClmfwoL8.js">
    <link rel="stylesheet" crossorigin href="/chat/assets/avatar/assets/useTaskEventStream-DlOhWPPz.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
