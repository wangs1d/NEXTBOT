<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nextbot · 主题配色方案对比</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
  body{background:#0e0e12;color:#eee;padding:24px;min-height:100vh;}
  h1{font-size:20px;margin-bottom:4px;font-weight:600;letter-spacing:.3px;}
  .sub{color:#8a8a92;font-size:13px;margin-bottom:20px;}
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px;}
  .seg{display:flex;background:#1a1a1f;border-radius:10px;padding:4px;gap:4px;}
  .seg button{border:none;background:transparent;color:#aaa;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s;}
  .seg button:hover{color:#ddd;}
  .seg button.active{background:#2c2c33;color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .tag{font-size:13px;color:#c9a35e;margin-left:4px;}

  .grid{display:grid;grid-template-columns:1fr;gap:24px;max-width:1100px;}

  /* 应用窗口 */
  .win{position:relative;border-radius:18px;overflow:hidden;height:680px;display:flex;
    box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);}
  .win.light{box-shadow:0 24px 80px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.06);}

  /* 侧栏 */
  .sb{width:60px;display:flex;flex-direction:column;align-items:center;padding:14px 0;flex-shrink:0;position:relative;z-index:2;}
  .sb .logo{width:32px;height:32px;border-radius:10px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
  .sb .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;font-size:15px;transition:all .2s;cursor:pointer;}
  .sb .ic.active{font-weight:600;}
  .sb .spacer{flex:1;}
  .sb .divider{width:24px;height:1px;margin:8px 0;}
  .sb .ava{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin-top:6px;}

  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
  .topbar{height:48px;display:flex;align-items:center;padding:0 18px;gap:12px;}
  .topbar .dot{width:9px;height:9px;border-radius:50%;}
  .topbar .title{font-size:14px;font-weight:600;}
  .topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .topbar .pill{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500;}
  .topbar .iconbtn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;}

  .content{flex:1;display:flex;min-height:0;overflow:hidden;}

  /* 聊天区 */
  .chat{flex:1;display:flex;flex-direction:column;padding:18px 20px;gap:14px;overflow:hidden;}

  /* 统计卡片行 */
  .stats{display:flex;gap:10px;margin-bottom:2px;}
  .stat{flex:1;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
  .stat .v{font-size:18px;font-weight:700;}
  .stat .l{font-size:10px;opacity:.7;}
  .stat .trend{font-size:10px;font-weight:600;margin-top:2px;}

  .chatrow{display:flex;gap:10px;align-items:flex-start;}
  .chatrow .av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
  .bubble{padding:10px 14px;border-radius:16px;max-width:70%;font-size:13px;line-height:1.55;}
  .bubble.bot{border-top-left-radius:5px;}
  .bubble.user{margin-left:auto;border-top-right-radius:5px;font-weight:500;}
  .chatrow.user{flex-direction:row-reverse;}

  /* 内容卡片 */
  .card{width:100%;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .card .row{display:flex;align-items:center;gap:10px;}
  .card .ch{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .card .t1{font-size:13px;font-weight:600;}
  .card .t2{font-size:11px;opacity:.7;margin-top:1px;}
  .card .bar{height:5px;border-radius:3px;position:relative;overflow:hidden;}
  .card .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;}
  .card .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .card .chip{font-size:10px;padding:4px 10px;border-radius:12px;font-weight:500;}

  /* 按钮组 */
  .btns{display:flex;gap:8px;align-items:center;}
  .btn{padding:7px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
  .btn.primary{color:#fff;}
  .btn.ghost{background:transparent;}
  .btn:hover{transform:translateY(-1px);}

  /* 输入框 */
  .inputbar{display:flex;align-items:center;gap:10px;margin-top:auto;padding:10px 14px;border-radius:22px;font-size:13px;}
  .inputbar .ph{opacity:.5;font-size:13px;}
  .inputbar .icons{display:flex;gap:6px;margin-left:auto;}
  .inputbar .ibtn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}
  .inputbar .send{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;}

  /* 右侧面板 */
  .rpanel{width:230px;padding:16px 14px;display:flex;flex-direction:column;gap:12px;overflow:hidden;flex-shrink:0;position:relative;z-index:1;}
  .rp-title{font-size:13px;font-weight:600;margin-bottom:0;}
  .rp-card{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .rp-card .rk{display:flex;justify-content:space-between;font-size:11px;}
  .rp-card .ring{width:48px;height:48px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-bottom:2px;}
  .rp-card .ring .in{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;}
  .rp-list{display:flex;flex-direction:column;gap:6px;}
  .rp-item{display:flex;align-items:center;gap:8px;font-size:11px;padding:6px 8px;border-radius:8px;cursor:pointer;}
  .rp-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

  .win-title{position:absolute;top:10px;left:10px;z-index:10;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:3px 10px;border-radius:7px;backdrop-filter:blur(8px);font-weight:500;}
  .win.light .win-title{color:#333;background:rgba(255,255,255,.75);}

  /* 色板 */
  .palette{margin-top:24px;border-radius:16px;padding:20px;background:#16161a;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-width:1100px;}
  .palette h2{grid-column:1/-1;font-size:15px;margin-bottom:4px;color:#ddd;}
  .palette .chip{border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;border:1px solid rgba(255,255,255,.08);}
  .palette .sw{height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.5px;border:1px solid rgba(255,255,255,.1);font-weight:600;}
  .palette .nm{font-size:11px;color:#999;}
  .palette .hex{font-size:10px;color:#666;font-family:monospace;}
  .metric{font-size:10px;color:#7fd67f;margin-top:1px;font-weight:500;}
  .metric.bad{color:#f77;}
  .metrics-box{grid-column:1/-1;background:#1a1a1f;border-radius:10px;padding:14px 16px;}
  .metrics-box .mrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px;font-size:11px;color:#aaa;}
</style>
</head>
<body>
<h1>Nextbot · 主题配色方案对比</h1>
<div class="sub">三套差异化配色 × 浅色/暗色 · 质感渲染版（柔和阴影 / 渐变气泡 / 玻璃侧栏 / 内阴影输入框）</div>

<div class="toolbar">
  <div class="seg" id="schemeSeg">
    <button data-k="A_warm_oat" class="active">A · 暖白燕麦</button>
    <button data-k="B_cool_mist">B · 冷灰月白</button>

  <span class="tag" id="tag"></span>
</div>

<div class="grid" id="grid"></div>
<div class="palette" id="palette"></div>

<script>
const SCHEMES = {

      "ter": "#6E9FD6",
      "card": "#121214"
    }
  }
};
const ACT = {A_warm_oat:'推荐 · 暖白燕麦精致版', B_cool_mist:'中性冷调 · 苹果式克制', C_paper:'黑白高对比 · 极简精致'};

let curScheme='A_warm_oat', curMode='light';

function lum(hex){let c=hex.replace('#','');c=c.length===6?c.match(/.{2}/g).map(x=>parseInt(x,16)/255):[0,0,0];c=c.map(v=>v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){let l1=lum(a),l2=lum(b),hi=Math.max(l1,l2),lo=Math.min(l1,l2);return ((hi+.05)/(lo+.05)).toFixed(2)}
function mix(a,b,t){const A=a.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16));const B=b.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16));return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function shade(hex,amt){const c=hex.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16));return '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v+amt))).toString(16).padStart(2,'0')).join('')}

function isPaper(){return curScheme==='C_paper'}

function buildWin(s, mode, name){
  const t = s[mode];
  const isLight = mode==='light';
  const paper = isPaper() && isLight;

  // 渐变：强调色 → 更深的强调色
  const priDark = shade(t.pri, -25);
  const priGrad = `linear-gradient(135deg, ${t.pri}, ${priDark})`;
  // 背景渐变：主色 → 略亮
  const bgLight = mix(t.mp, '#FFFFFF', 0.4);
  const bgGrad = isLight ? `linear-gradient(180deg, ${bgLight} 0%, ${t.mp} 100%)` : t.mp;

  // 侧栏样式
  const sbBg = isLight ? (paper ? t.sb : `linear-gradient(180deg, ${t.sb}, ${mix(t.sb,t.mp,0.3)})`) : t.sb;
  const sbBorderRight = paper ? 'none' : `1px solid ${t.sep}`;
  const sbShadow = paper ? '8px 0 32px rgba(0,0,0,.06)' : 'none';

  // 卡片阴影
  const cardShadow = isLight
    ? `0 2px 12px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.03)`
    : `0 2px 12px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.2)`;
  const cardBorder = `1px solid ${t.out}${isLight?'44':'66'}`;

  // 助手气泡
  const botBg = isLight ? t.s1 : t.s2;
  const botBorder = `1px solid ${t.out}${isLight?'33':'44'}`;

  // 输入框
  const inputShadow = isLight
    ? `inset 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.02)`
    : `inset 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.15)`;

  const icon = (ic, active=false) => `<div class="ic ${active?'active':''}" style="color:${active?t.pri:t.iconD};background:${active?t.priC:'transparent'}">${ic}</div>`;

  return `
  <div class="win ${isLight?'light':''}" style="background:${bgGrad};color:${t.onS}">
    <div class="win-title">${name}</div>
    <div class="sb" style="background:${sbBg};border-right:${sbBorderRight};box-shadow:${sbShadow}">
      <div class="logo" style="background:${priGrad};color:${t.onPri};box-shadow:0 2px 8px ${t.pri}55">PA</div>
      ${icon('💬',true)}
      ${icon('★')}
      ${icon('📄')}
      ${icon('⚙')}
      <div class="spacer"></div>
      <div class="divider" style="background:${t.sep}"></div>
      ${icon('🔔')}
      <div class="ava" style="background:${t.priC};color:${t.onPriC}">你</div>
    </div>
    <div class="main">
      <div class="topbar" style="border-bottom:1px solid ${t.sep}${isLight?'88':'66'}">
        <div class="dot" style="background:${t.ter}"></div>
        <span class="title">Nextbot</span>
        <div class="right">
          <span class="pill" style="background:${t.priC};color:${t.onPriC}">${isLight?'浅色':'暗色'} · ${name.split('·')[0].trim()}</span>
          <div class="iconbtn" style="color:${t.iconD}">🔍</div>
          <div class="iconbtn" style="color:${t.iconD}">⋯</div>
        </div>
      </div>
      <div class="content">
        <div class="chat" style="background:transparent">
          <!-- 统计卡片 -->
          <div class="stats">
            <div class="stat" style="background:${t.s0};border:${cardBorder};box-shadow:${cardShadow}">
              <span class="v" style="color:${t.onS}">12</span>
              <span class="l" style="color:${t.onSv}">今日对话</span>
              <span class="trend" style="color:${t.ter}">↑ 18%</span>
            </div>
            <div class="stat" style="background:${t.s0};border:${cardBorder};box-shadow:${cardShadow}">
              <span class="v" style="color:${t.onS}">8</span>
              <span class="l" style="color:${t.onSv}">已完成任务</span>
              <span class="trend" style="color:${t.pri}">↑ 12%</span>
            </div>
            <div class="stat" style="background:${t.s0};border:${cardBorder};box-shadow:${cardShadow}">
              <span class="v" style="color:${t.onS}">3</span>
              <span class="l" style="color:${t.onSv}">进行中</span>
              <span class="trend" style="color:${t.onSv}">— 持平</span>
            </div>
          </div>

          <div class="chatrow bot">
            <div class="av" style="background:${t.priC};color:${t.onPriC}">A</div>
            <div class="bubble bot" style="background:${botBg};color:${t.onS};border:${botBorder};box-shadow:${cardShadow}">
              早上好，今天有什么需要我帮忙的？
            </div>
          </div>
          <div class="chatrow user">
            <div class="av" style="background:${t.s4};color:${t.onS}">我</div>
            <div class="bubble user" style="background:${priGrad};color:${t.onPri};box-shadow:0 4px 14px ${t.pri}44">帮我查一下明天的日程安排</div>
          </div>

          <!-- 内容卡片 -->
          <div class="card" style="background:${t.s0};border:${cardBorder};box-shadow:${cardShadow}">
            <div class="row">
              <div class="ch" style="background:${t.priC};color:${t.onPriC}">🕐</div>
              <div style="flex:1">
                <div class="t1" style="color:${t.onS}">明日日程</div>
                <div class="t2" style="color:${t.onSv}">3 个安排 · 2 项提醒</div>
              </div>
              <div class="btns">
                <button class="btn primary" style="background:${priGrad};box-shadow:0 2px 8px ${t.pri}33">查看</button>
                <button class="btn ghost" style="color:${t.onSv};border:1px solid ${t.out}66">稍后</button>
              </div>
            </div>
            <div class="bar" style="background:${t.s3}"><div class="fill" style="background:${priGrad};width:62%"></div></div>
            <div class="chips">
              <span class="chip" style="background:${t.priC};color:${t.onPriC}">09:30 产品会议</span>
              <span class="chip" style="background:${t.s3};color:${t.onSv}">14:00 设计评审</span>
              <span class="chip" style="background:${t.s3};color:${t.onSv}">18:30 健身</span>
            </div>
          </div>

          <div class="chatrow bot">
            <div class="av" style="background:${t.priC};color:${t.onPriC}">A</div>
            <div class="bubble bot" style="background:${botBg};color:${t.onS};border:${botBorder};box-shadow:${cardShadow}">
              已为你整理好明日安排，可点击卡片查看详情或添加提醒。
            </div>
          </div>

          <!-- 输入框 -->
          <div class="inputbar" style="background:${t.s0};border:1px solid ${t.out}88;box-shadow:${inputShadow}">
            <span class="ph" style="color:${t.onSv}">输入消息，或按 / 唤起工具…</span>
            <div class="icons">
              <div class="ibtn" style="color:${t.iconD};background:${t.s2}">📎</div>
              <div class="ibtn" style="color:${t.iconD};background:${t.s2}">🎤</div>
              <div class="send" style="background:${priGrad};color:${t.onPri};box-shadow:0 2px 8px ${t.pri}44">↑</div>
            </div>
          </div>
        </div>

        <!-- 右侧面板 -->
        <div class="rpanel" style="background:${isLight?(paper?t.s1:mix(t.mp,t.sb,0.5)):t.s1};border-left:${paper?'none':`1px solid ${t.sep}88`};box-shadow:${paper?'-8px 0 32px rgba(0,0,0,.04)':'none'}">
          <div class="rp-title" style="color:${t.onS}">活动面板</div>
          <div class="rp-card" style="background:${t.s0};border:${cardBorder};box-shadow:${cardShadow}">
            <div class="ring" style="background:conic-gradient(${t.pri} 0 68%, ${t.s3} 68% 100%);color:${t.onS}">
              <div class="in" style="background:${t.s0};color:${t.onSv}">68%</div>
            </div>
            <div style="font-size:12px;font-weight:600;color:${t.onS}">今日完成度</div>
            <div class="rk"><span style="color:${t.onSv}">已完成</span><b style="color:${t.onS}">8</b></div>
            <div class="rk"><span style="color:${t.onSv}">进行中</span><b style="color:${t.onS}">3</b></div>
            <div class="rk"><span style="color:${t.onSv}">待开始</span><b style="color:${t.onS}">1</b></div>
          </div>
          <div class="rp-card" style="background:${t.s2};border:1px solid ${t.out}44">
            <div style="font-size:12px;font-weight:600;color:${t.onS};margin-bottom:2px">快捷工具</div>
            <div class="rp-list">
              <div class="rp-item" style="color:${t.onSv}"><span class="dot" style="background:${t.pri}"></span>智能路由</div>
              <div class="rp-item" style="color:${t.onSv}"><span class="dot" style="background:${t.sec}"></span>记忆检索</div>
              <div class="rp-item" style="color:${t.onSv}"><span class="dot" style="background:${t.ter}"></span>设备控制</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function buildPalette(s, mode){
  const t=s[mode]; const isLight=mode==='light';
  const items = [
    ['主面板 mp', t.mp, t.onS], ['侧栏 sb', t.sb, t.onS], ['卡片 s0', t.s0, t.onS],
    ['surface s1', t.s1, t.onS], ['surface s2', t.s2, t.onS], ['surface s3', t.s3, t.onS],
    ['surface s4', t.s4, t.onS], ['主文字', t.onS, t.mp], ['次级文字', t.onSv, t.mp],
    ['描边 out', t.out, t.mp], ['图标默认', t.iconD, t.sb], ['图标选中', t.iconS, t.sb],
    ['primary', t.pri, t.onPri], ['pri容器', t.priC, t.onPriC], ['tertiary', t.ter, t.mp], ['secondary', t.sec, t.mp],
  ];
  const metric = (label,a,b,min) => {
    const v = parseFloat(cr(a,b));
    const ok = v>=min;
    return `<span style="color:${ok?'#7fd67f':'#f77'}">${label} ${v}:1 ${ok?'✓':'✗(≥'+min+')'}</span>`;
  };
  return `<h2>色板 · ${mode==='light'?'浅色':'暗色'} 关键指标</h2>
    ${items.map(it=>`<div class="chip">
      <div class="sw" style="background:${it[1]};color:${it[2]}">Aa</div>
      <div class="nm">${it[0]}</div>
      <div class="hex">${it[1]}</div>
    </div>`).join('')}
    <div class="metrics-box">
      <div class="mrow">
        ${metric('侧栏 vs 主面板', t.sb, t.mp, 1.12)}
        ${metric('卡片 vs 主面板', t.s0, t.mp, 1.12)}
        ${metric('s4 vs 主面板', t.s4, t.mp, 1.25)}
        ${metric('描边 vs 背景', t.out, t.mp, isLight?2.0:1.6)}
        ${metric('主文字', t.onS, t.mp, 10)}
        ${metric('次级文字', t.onSv, t.mp, 4.5)}
        ${metric('图标默认', t.iconD, t.sb, 4.5)}
        ${metric('primary 按钮文字', t.pri, t.mp, isLight?4.5:4.0)}
      </div>
    </div>`;
}

function render(){
  const s = SCHEMES[curScheme];
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const cell = document.createElement('div');
  cell.innerHTML = buildWin(s, curMode, s.name);
  grid.appendChild(cell);
  document.getElementById('palette').innerHTML = buildPalette(s, curMode);
  document.getElementById('tag').textContent = ACT[curScheme];
}

document.getElementById('schemeSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  curScheme=b.dataset.k;
  document.querySelectorAll('#schemeSeg button').forEach(x=>x.classList.toggle('active',x===b));
  render();
});
document.getElementById('modeSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  curMode=b.dataset.m;
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('active',x===b));
  render();
});

render();
</script>
</body>
</html>
