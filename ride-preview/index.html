<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>打车 · 选个上车点（交互效果）</title>
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#1c1c1f;
    --panel-2:#252529;
    --text:#f5f5f7;
    --muted:#9b9ba1;
    --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%,#1d1d24 0%,#0b0b0d 60%),
      #0b0b0d;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:28px 16px;
  }
  .stage{width:100%;max-width:393px}
  .phone{
    position:relative;width:100%;
    background:transparent;display:flex;flex-direction:column;
  }
  .statusbar{
    height:22px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 6px;font-size:12px;font-weight:600;letter-spacing:.2px;color:#a1a1a6;
  }
  .statusbar .icons{display:flex;gap:5px;align-items:center;opacity:.9}
  .statusbar .bar{width:3px;background:#f5f5f7;border-radius:2px}
  .chat{
    flex:0 0 auto;overflow:visible;
    padding:6px 0 4px;
  }
  .chat::-webkit-scrollbar{display:none}
  .row{display:flex;margin-top:14px}
  .row.user{justify-content:flex-end}
  .bubble{
    max-width:82%;
    padding:12px 16px;
    font-size:16px;line-height:1.5;
    border-radius:22px;
  }
  .row.user .bubble{background:#f4f4f5;color:#0b0b0d;border-bottom-right-radius:8px}
  .row.bot .bubble{background:#26262a;color:var(--text);border-bottom-left-radius:8px}
  .card{
    margin-top:14px;
    background:var(--panel);
    border-radius:16px;
    padding:14px;
  }
  .card-head{display:flex;gap:9px;align-items:flex-start}
  .taxi{
    width:20px;height:20px;flex:0 0 auto;margin-top:1px;color:var(--text);
  }
  .card-title{font-size:17px;font-weight:600;line-height:1.25}
  .card-sub{
    margin-top:3px;font-size:12.5px;color:var(--muted);line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .map-wrap{
    position:relative;margin-top:12px;height:196px;border-radius:12px;overflow:hidden;
    background:#e6e6e8;
    touch-action:none;cursor:grab;
  }
  .map-wrap:active{cursor:grabbing}
  .map-img{
    position:absolute;left:50%;top:50%;width:1024px;height:1024px;
    transform:translate(-50%,-50%) translate(0,0) scale(1);
    transform-origin:center;
    user-select:none;pointer-events:none;will-change:transform;
  }
  .map-placeholder{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#6b6b70;font-size:12px;background:
      linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px) 0 0/28px 28px,
      #e6e6e8;
  }
  .pin{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);
    display:flex;flex-direction:column;align-items:center;pointer-events:none;
  }
  .pin svg{width:42px;height:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
  .pin-label{
    margin-top:1px;background:rgba(15,15,16,.88);color:#fff;
    font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;
    white-space:nowrap;backdrop-filter:blur(4px);
  }
  .hint{margin-top:9px;font-size:11.5px;color:var(--muted);line-height:1.4}
  .custom{
    margin-top:10px;padding:10px 12px;border:1.2px solid rgba(255,255,255,.66);
    border-radius:12px;background:rgba(255,255,255,.015);
  }
  .custom-title{font-size:14.5px;font-weight:600;line-height:1.3}
  .custom-sub{margin-top:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cta{
    margin-top:12px;width:100%;height:48px;border:0;border-radius:12px;
    background:#fff;color:#0b0b0d;font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:transform .12s ease,opacity .12s ease;
  }
  .cta:active{transform:scale(.985);opacity:.92}
  .meta{
    margin:14px auto 0;max-width:430px;text-align:center;
    font-size:11.5px;line-height:1.6;color:#71717a;
  }
  .quote{
    margin-top:12px;background:var(--panel);border-radius:16px;padding:14px;
    display:none;
  }
  .quote.show{display:block}
  .quote h4{margin:0 0 10px;font-size:15px}
  .opt{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 12px;border:1px solid rgba(255,255,255,.1);border-radius:12px;margin-top:8px;
  }
  .opt.selected{border-color:#fff;background:rgba(255,255,255,.06)}
  .opt .name{font-size:14px}
  .opt .desc{font-size:11.5px;color:var(--muted);margin-top:2px}
  .opt .price{font-size:16px;font-weight:700}
  @media (max-width:430px){
    body{padding:16px 16px 20px}
    .meta{padding:0 4px 4px}
  }
</style>
</head>

<script>
(function(){
  var map = document.getElementById('map');
  var img = document.getElementById('mapImg');
  var coordsEl = document.getElementById('coords');
  var fallback = document.getElementById('mapFallback');

  // 兴义市街心花园 / 下五屯附近；底图由高德公开瓦片拼接（GCJ-02 近似）
  var Z = 16;
  var G0 = { lat: 25.0913, lng: 104.8973 };
  var TILE = 256;

  function worldSize(z){ return TILE * Math.pow(2, z); }
  function project(lat, lng, z){
    var w = worldSize(z);
    var x = (lng + 180) / 360 * w;
    var s = Math.sin(lat * Math.PI / 180);
    var y = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * w;
    return { x: x, y: y };
  }
  function unproject(x, y, z){
    var w = worldSize(z);
    var lng = x / w * 360 - 180;
    var n = Math.PI - 2 * Math.PI * y / w;
    var lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    return { lat: lat, lng: lng };
  }

  var G0px = project(G0.lat, G0.lng, Z);
  var offX = 0, offY = 0, scale = 1;

  function apply(){
    img.style.transform = 'translate(-50%,-50%) translate(' + offX + 'px,' + offY + 'px) scale(' + scale + ')';
  }
  function refreshCoords(){
    var g = unproject(G0px.x - offX / scale, G0px.y - offY / scale, Z);
    coordsEl.textContent = g.lng.toFixed(4) + ', ' + g.lat.toFixed(4);
  }

  img.addEventListener('load', function(){ fallback.style.display = 'none'; });
  if (img.complete && img.naturalWidth) fallback.style.display = 'none';
  img.addEventListener('error', function(){
    fallback.textContent = '地图底图加载失败';
    fallback.style.display = 'flex';
  });

  var dragging = false, startX = 0, startY = 0, baseX = 0, baseY = 0, moved = 0;

  map.addEventListener('pointerdown', function(e){
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    baseX = offX; baseY = offY;
    moved = 0;
    map.setPointerCapture(e.pointerId);
  });

  map.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var dx = e.clientX - startX, dy = e.clientY - startY;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    offX = baseX + dx;
    offY = baseY + dy;
    apply();
    if (moved > 5) refreshCoords();
  });

  function finish(e){
    if (!dragging) return;
    dragging = false;
    try { map.releasePointerCapture(e.pointerId); } catch (_) {}
    var dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4){
      // 单击：让点击位置的地物移动到图钉下方（用点击点相对地图中心的位移）
      var rect = map.getBoundingClientRect();
      var tapDx = e.clientX - (rect.left + rect.width / 2);
      var tapDy = e.clientY - (rect.top + rect.height / 2);
      offX = baseX - tapDx;
      offY = baseY - tapDy;
    } else {
      offX = baseX + dx;
      offY = baseY + dy;
    }
    apply();
    refreshCoords();
  }

  map.addEventListener('pointerup', finish);
  map.addEventListener('pointercancel', finish);

  map.addEventListener('wheel', function(e){
    e.preventDefault();
    var next = scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15);
    scale = Math.max(0.65, Math.min(2.4, next));
    apply();
    refreshCoords();
  }, { passive: false });

  var pinch = 0, baseScale = 1;
  map.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){
      dragging = false;
      var a = e.touches[0], b = e.touches[1];
      pinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      baseScale = scale;
    }
  }, { passive: true });
  map.addEventListener('touchmove', function(e){
    if (e.touches.length === 2 && pinch){
      var a = e.touches[0], b = e.touches[1];
      var dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      scale = Math.max(0.65, Math.min(2.4, baseScale * dist / pinch));
      apply();
      refreshCoords();
    }
  }, { passive: true });

  var cta = document.getElementById('cta');
  var quote = document.getElementById('quote');
  cta.addEventListener('click', function(){
    quote.classList.add('show');
    quote.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  refreshCoords();
  apply();
})();
</script>
