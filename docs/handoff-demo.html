<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTBOT · 计划交接（handoff）实测回放</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#121212; --panel2:#181818; --line:#262626;
    --fg:#f5f5f5; --fg2:#a3a3a3; --fg3:#6b6b6b;
    --accent:#ffffff; --ok:#7ee2a8; --warn:#ffd479; --err:#ff8a8a; --run:#8ab8ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  header{
    width:100%; max-width:1180px; padding:22px 24px 10px;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header h1{font-size:17px; font-weight:600; letter-spacing:.5px}
  header .sub{font-size:12.5px; color:var(--fg3)}
  .stage{
    width:100%; max-width:1180px; padding:12px 24px 28px;
    display:grid; grid-template-columns:minmax(360px,460px) 1fr; gap:18px;
    align-items:start;
  }
  @media (max-width:900px){ .stage{grid-template-columns:1fr} }

  /* ── 手机壳 ─────────────────────────── */
  .phone{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    display:flex; flex-direction:column; height:640px; overflow:hidden;
    position:sticky; top:16px;
  }
  .phone .bar{
    padding:12px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .orb{
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #ffffff 0%, #d9d9d9 42%, #4a4a4a 100%);
    box-shadow:0 0 14px rgba(255,255,255,.35), 0 0 34px rgba(255,255,255,.12);
    flex:none;
  }
  .bar .name{font-size:13.5px; font-weight:600}
  .bar .st{font-size:11px; color:var(--fg3); margin-left:auto}
  .stream{flex:1; overflow-y:auto; padding:14px 12px 8px; display:flex; flex-direction:column; gap:10px}
  .stream::-webkit-scrollbar{width:0}

  .msg{max-width:86%; animation:in .28s ease both}
  @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .user{align-self:flex-end; background:#f2f2f2; color:#111;
    border-radius:14px 14px 4px 14px; padding:9px 12px; font-size:13px; line-height:1.55}
  .agent{align-self:flex-start; width:92%;}
  .agent .bubble{font-size:13px; line-height:1.6; color:var(--fg); white-space:pre-wrap}
  .meta{font-size:10.5px; color:var(--fg3); margin:2px 0 4px 2px; letter-spacing:.3px}

  .tool{
    align-self:flex-start; font-family:ui-monospace,Consolas,monospace;
    font-size:11px; color:var(--fg2); background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:5px 9px;
    animation:in .28s ease both; max-width:92%;
  }
  .tool b{color:var(--fg); font-weight:600}
  .tool .ok{color:var(--ok)}

  .event{
    align-self:center; font-size:10.5px; color:var(--fg3);
    border:1px dashed var(--line); border-radius:999px; padding:3px 12px;
    animation:in .28s ease both; text-align:center;
  }
  .event.hot{color:var(--warn); border-color:#4d3f1e}

  /* 底部：步骤条 + 输入框 */
  .bottom{border-top:1px solid var(--line); padding:8px 12px 12px; background:var(--panel)}
  .planCard{display:none; border:1px solid var(--line); border-radius:12px; padding:9px 11px; margin-bottom:8px;
    background:var(--panel2); animation:in .3s ease both}
  .planCard.show{display:block}
  .planHead{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--fg2); margin-bottom:6px}
  .planHead b{color:var(--fg); font-weight:600; font-size:12px}
  .prow{display:flex; gap:7px; align-items:flex-start; padding:2.5px 0; font-size:12px; line-height:1.45}
  .dot{width:14px; height:14px; border-radius:50%; border:1.4px solid var(--fg3); flex:none; margin-top:1.5px; position:relative}
  .prow.running .dot{border-color:var(--run)}
  .prow.running .dot::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--run)}
  .prow.waiting .dot{border-color:var(--warn); background:rgba(255,212,121,.15)}
  .prow.done .dot{border-color:var(--ok); background:var(--ok)}
  .prow.done .dot::after{content:"✓"; position:absolute; inset:0; font-size:9px; color:#0a0a0a;
    display:flex; align-items:center; justify-content:center; font-weight:700}
  .prow .t{color:var(--fg2)} .prow.done .t{color:var(--fg3); text-decoration:line-through}
  .prow.running .t{color:var(--fg)} .prow.waiting .t{color:var(--warn)}
  .handoff{margin-top:5px; padding:7px 9px; border-radius:9px; background:rgba(255,212,121,.07);
    border:1px solid rgba(255,212,121,.25); font-size:11.5px; line-height:1.5; color:var(--warn); display:none}
  .handoff.show{display:block}
  .btn{
    margin-top:8px; display:none; width:100%; border:none; border-radius:9px;
    background:#f2f2f2; color:#111; font-size:12.5px; font-weight:600; padding:8px 0; cursor:pointer;
    animation:pulse 1.8s ease infinite;
  }
  .btn.show{display:block}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.25)} 50%{box-shadow:0 0 0 5px rgba(255,255,255,0)}}
  .inputMock{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line);
    border-radius:999px; padding:8px 14px; color:var(--fg3); font-size:12.5px;
  }

  /* ── 右侧：内部状态 ─────────────────── */
  .side{display:flex; flex-direction:column; gap:14px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
  .card h2{font-size:12px; font-weight:600; color:var(--fg2); letter-spacing:1px; margin-bottom:10px}
  .stateRow{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px}
  .chip{font-size:10px; padding:1.5px 8px; border-radius:999px; border:1px solid var(--line); color:var(--fg3); min-width:52px; text-align:center}
  .chip.pending{color:var(--fg3)} .chip.running{color:var(--run); border-color:#2c4a77}
  .chip.waiting{color:var(--warn); border-color:#4d3f1e; background:rgba(255,212,121,.08)}
  .chip.done{color:var(--ok); border-color:#2b5c3f}
  .stateRow .nm{color:var(--fg2)} .stateRow .id{color:var(--fg3); font-family:ui-monospace,monospace; font-size:10.5px}
  .log{font-family:ui-monospace,Consolas,monospace; font-size:11px; line-height:1.75; color:var(--fg2);
    max-height:300px; overflow-y:auto; white-space:pre-wrap}
  .log .t{color:var(--fg3)} .log .hl{color:var(--warn)} .log .g{color:var(--ok)}
  .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .controls button{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:9px;
    padding:7px 16px; font-size:12.5px; cursor:pointer;
  }
  .controls button:hover{border-color:var(--fg3)}
  .controls button.primary{background:#f2f2f2; color:#111; border-color:#f2f2f2; font-weight:600}
  .hint{font-size:11px; color:var(--fg3); line-height:1.6}
  .hint b{color:var(--fg2)}
</style>
</head>
<body>

<header>
  <h1>NEXTBOT · 计划交接（handoff）实测回放</h1>
  <span class="sub">拆步 → 停下交给你 → 你点一下 → 它接着办</span>
</header>

<div class="stage">
  <div class="phone">
    <div class="bar">
      <div class="orb"></div>
      <div class="name">NEXTBOT</div>
      <div class="st" id="phase">空闲</div>
    </div>
    <div class="stream" id="stream"></div>
    <div class="bottom">
      <div class="planCard" id="planCard">
        <div class="planHead"><b>任务步骤</b><span id="planProgress">0/3</span><span style="margin-left:auto;font-size:10px;color:var(--fg3)">会话内计划</span></div>
        <div id="planRows"></div>
        <div class="handoff" id="handoff"></div>
        <button class="btn" id="doneBtn" onclick="userConfirm()">我已完成，继续下一步</button>
      </div>
      <div class="inputMock">发消息…</div>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <h2>控制</h2>
      <div class="controls">
        <button class="primary" id="playBtn" onclick="togglePlay()">▶ 自动播放</button>
        <button onclick="advance()">单步 →</button>
        <button onclick="reset()">重置</button>
      </div>
      <p class="hint" style="margin-top:10px">
        <b>看什么：</b>第 2 步要你自己付款时，agent 会把下单类工具<b>整族收起</b>（调不动，不是嘴上说说），
        步骤条亮起「等你操作」；你点一下按钮，服务端在点击原点把该步置 done、确定性路由回任务面，继续做第 3 步。
      </p>
    </div>
    <div class="card">
      <h2>PLAN 状态机</h2>
      <div id="stateRows"></div>
    </div>
    <div class="card">
      <h2>事件流（服务端视角）</h2>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script>
const stream = document.getElementById("stream");
const planRows = document.getElementById("planRows");
const planCard = document.getElementById("planCard");
const planProgress = document.getElementById("planProgress");
const handoff = document.getElementById("handoff");
const doneBtn = document.getElementById("doneBtn");
const logEl = document.getElementById("log");
const stateRows = document.getElementById("stateRows");
const phaseEl = document.getElementById("phase");

const plan = [
  { id:"s1", title:"找 30 元内的麻辣烫，挑一家", status:"pending" },
  { id:"s2", title:"你在美团下单付款", status:"pending" },
  { id:"s3", title:"设一个下楼取餐的提醒", status:"pending" },
];
const CHIP = { pending:["pending","待办"], running:["running","进行中"], waiting:["waiting","等你操作"], done:["done","完成"] };

function renderPlan(){
  planCard.classList.toggle("show", planVisible);
  planRows.innerHTML = plan.map(s=>{
    const cls = s.status==="done"?"done":s.status==="running"?"running":s.status==="waiting"?"waiting":"";
    return `<div class="prow ${cls}"><div class="dot"></div><div class="t">${s.title}</div></div>`;
  }).join("");
  const done = plan.filter(s=>s.status==="done").length;
  planProgress.textContent = `${done}/${plan.length}`;
  stateRows.innerHTML = plan.map(s=>{
    const [cls,label] = CHIP[s.status];
    return `<div class="stateRow"><span class="chip ${cls}">${label}</span><span class="id">${s.id}</span><span class="nm">${s.title}</span></div>`;
  }).join("");
  const blocking = plan.find(s=>s.status==="waiting");
  handoff.classList.toggle("show", !!blocking);
  handoff.textContent = blocking ? ("等你操作：" + blocking.instruction) : "";
  doneBtn.classList.toggle("show", !!blocking);
}

function log(text, cls=""){
  const time = new Date().toTimeString().slice(0,8);
  const div = document.createElement("div");
  div.innerHTML = `<span class="t">[${time}]</span> <span class="${cls}">${text}</span>`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function addUser(text){
  const d = document.createElement("div");
  d.className = "msg user"; d.textContent = text;
  stream.appendChild(d); stream.scrollTop = stream.scrollHeight;
}
function addAgent(html){
  const w = document.createElement("div");
  w.className = "msg agent";
  w.innerHTML = `<div class="meta">NEXTBOT</div><div class="bubble">${html}</div>`;
  stream.appendChild(w); stream.scrollTop = stream.scrollHeight;
  return w;
}
function addTool(name, args, ok=true){
  const d = document.createElement("div");
  d.className = "tool";
  d.innerHTML = `tool_call <b>${name}</b>(${args}) <span class="ok">→ ok</span>`;
  stream.appendChild(d); stream.scrollTop = stream.scrollHeight;
}
function addEvent(text, hot=false){
  const d = document.createElement("div");
  d.className = "event" + (hot?" hot":"");
  d.textContent = text;
  stream.appendChild(d); stream.scrollTop = stream.scrollHeight;
}
function setPhase(t){ phaseEl.textContent = t; }

/* ── 场景脚本 ─────────────────────────── */
let planVisible = false;

const script = [
  { run(){ setPhase("输入中"); addUser("帮我在美团点一份麻辣烫送到公司，三十块以内，点完提醒我下楼取。");
           log("chat.user_message 收到"); }},
  { run(){ setPhase("思考中");
           addTool("search_web", `"美团 麻辣烫 外送 公司附近"`);
           log("plan.write ← 模型自己写下 3 步（压力信号：跨 2 域 + 多步）"); }},
  { run(){ addTool("search_web", `"杨国福 麻辣烫 套餐 价格"`);
           renderPlan(); }},
  { run(){ planVisible = true; plan[0].status="done"; plan[1].status="running"; renderPlan();
           addAgent("找到了 3 家 30 元以内的，最合适的是「杨国福」麻辣烫单人餐（28.9 元，含主食+饮品），评分 4.6，配送到公司前台约 25 分钟。");
           log("plan_step s1 → done"); }},
  { run(){ plan[1].status="waiting"; plan[1].instruction="打开美团 App，下单「杨国福 28.9 元单人餐」，地址选公司前台，付款即可。"; renderPlan();
           addEvent("外部动作工具整族收起：shopping.order.* / wallet.pay / payment.* —— 本轮调不动", true);
           log("<span class='hl'>tool_face_masked</span> act_external ×5（等待用户操作期间）", "hl"); }},
  { run(){ addAgent("下单付款这步得你来：在美团里下单「杨国福 28.9 元单人餐」，地址选公司前台。我在这步停住等你，付完款点下面的按钮，我马上接着设提醒。");
           log("plan_step s2 → waiting（handoff.instruction 已随步骤下发）"); }},
  { run(){ setPhase("等你操作"); addEvent("⏸ 停在第 2 步，等你点外卖", true);
           log("<span class='hl'>awaiting_confirm</span> 恢复通道=用户回执 / 事实探测（probe）"); }},
  { wait:true },
  { run(){ setPhase("继续执行");
           addEvent("chat.user_action → plan.resume(by:user) → 路由=multi_step_task（确定性，不猜意图）");
           log("<span class='g'>resume</span> s2 → done（by=user，在点击原点置位）"); }},
  { run(){ plan[1].status="done"; plan[2].status="running"; renderPlan();
           log("plan_step s2 → done ｜ s3 → running"); }},
  { run(){ addTool("reminder.plan", `{ title:"下楼取麻辣烫", at:"+12min" }`); }},
  { run(){ plan[2].status="done"; renderPlan();
           addAgent("搞定。提醒设好了，取餐预计到楼下时间前 12 分钟会叫你。慢用～");
           log("plan_step s3 → done ｜ 计划完成，步骤条收起"); }},
  { run(){ setPhase("空闲"); addEvent("✓ 计划 3/3 完成，步骤条已收起");
           log("计划归档（data/session-plans/，7 天清理）"); }},
];

let idx = 0, playing = false, timer = null;

function advance(){
  if (idx >= script.length){ stopPlay(); return; }
  const step = script[idx++];
  step.run();
  if (step.wait){
    stopPlay();               // 停在等待态，等用户点按钮
    setPhase("等你操作");
    return;
  }
  if (playing) timer = setTimeout(advance, 950);
}

function userConfirm(){
  // 按钮点击 = 用户回执：把等待态消化掉，继续播放后续脚本
  if (script[idx] && script[idx].wait) idx++;   // 越过 wait
  playing = true; advance();
  if (!timer) timer = setTimeout(advance, 950);
  const b = document.getElementById("playBtn");
  b.textContent = "⏸ 暂停";
}

function togglePlay(){
  if (playing){ stopPlay(); return; }
  playing = true;
  document.getElementById("playBtn").textContent = "⏸ 暂停";
  advance();
}
function stopPlay(){
  playing = false;
  if (timer){ clearTimeout(timer); timer = null; }
  document.getElementById("playBtn").textContent = "▶ 自动播放";
}
function reset(){
  stopPlay(); idx = 0; planVisible = false;
  stream.innerHTML = ""; logEl.innerHTML = "";
  plan.forEach(s=>{ s.status="pending"; delete s.instruction; });
  renderPlan(); setPhase("空闲");
  log("重置。点「自动播放」或「单步」开始");
}
renderPlan();
log("就绪。这是服务端视角的事件流，右侧同步显示 plan 状态机");
</script>
</body>
</html>
