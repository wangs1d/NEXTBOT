# NEXTBOT — nextbot.top 80/443 端口路由（2026-10-16 上 HTTPS；2026-10-20 根域纳入 https）
# 统一入口（取代原 iptables 80→3000 转发）：
#   - login.nextbot.top  → Node 登录页；根路径 302 到 /accounts/web（保留 cb/state 参数）
#     HTTPS（2026-10-16 已上线）：登录子域主体走 443（Let's Encrypt，certbot webroot
#     自动续期），80 只留 ACME 验证与 301 跳转；APK/桌面端登录页发
#     https://login.nextbot.top 即可，明文白名单可整表摘除
#   - nextbot.top / www.nextbot.top → 同一张证书（SAN 已扩展，2026-10-20）走 443；
#     80 只留 ACME 验证 + 301 跳 https
#   - IP 直访 → 80 default_server 保底反代 Node 主服务（不跳 https，避免吃证书告警）
# Node 主服务常驻 127.0.0.1:3000（systemd: private-agent）。
# 持久化注意：/etc/iptables/rules.v4 里的 REDIRECT 规则必须与本项目同时摘除，
# 否则重启后内核层转发会绕过 nginx。
# 证书路径 /etc/letsencrypt/live/login.nextbot.top/（SAN: login.nextbot.top /
# nextbot.top / www.nextbot.top）；续期由 certbot.timer 自动跑（deploy-hook 已挂
# systemctl reload nginx）。

# WebSocket Upgrade 头映射（ws 聊天 / 语音 duplex 透传必需）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ───────────────────────── 80 端口 ─────────────────────────

# 默认块：IP 直访与所有未匹配域名的保底，行为与此前 80→3000 完全一致
server {
    listen 80 default_server;
    server_name _;

    # 图片上传 / 图库等请求体放宽（nginx 默认 1m 会掐断）
    client_max_body_size 20m;

    # ACME HTTP-01 挑战路径（certbot webroot 签发/续期必须走 80）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 长连接（WebSocket / SSE）不被默认 60s 空闲超时掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 登录子域 80：只留 ACME 挑战路径（HTTP-01 验证必须走 80），其余 301 到 https
server {
    listen 80;
    server_name login.nextbot.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 根域 80：只留 ACME 挑战路径，其余 301 到 https（IP 直访不在此列，仍走 default_server）
server {
    listen 80;
    server_name nextbot.top www.nextbot.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ───────────────────────── 443 端口 ─────────────────────────

# 登录子域 443：登录页 / 注册 / OTP 验证码主入口（APK 与桌面端都吃这里）
server {
    # nginx < 1.25 老语法；若升级到 1.25+ 可拆成 listen 443 ssl; + http2 on;
    listen 443 ssl http2;
    server_name login.nextbot.top;

    ssl_certificate     /etc/letsencrypt/live/login.nextbot.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/login.nextbot.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：浏览器此后一年强制 https（证书调试期可先注释）
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    # 根路径直接亮登录页；保留 cb/state 等查询参数
    location = / {
        return 302 /accounts/web$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 根域 443：Node 主服务落地页 / chat / 各功能页（与登录子域共用同一张证书）
server {
    listen 443 ssl http2;
    server_name nextbot.top www.nextbot.top;

    ssl_certificate     /etc/letsencrypt/live/login.nextbot.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/login.nextbot.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：浏览器此后一年强制 https（不含 includeSubDomains，不影响 api/login 子域）
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
