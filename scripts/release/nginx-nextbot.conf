# NEXTBOT — nextbot.top 80/443 端口路由（2026-10-16 增加 HTTPS）
# 统一入口（取代原 iptables 80→3000 转发）：
#   - login.nextbot.top  → Node 登录页；根路径 302 到 /accounts/web（保留 cb/state 参数）
#     HTTPS（2026-10-16）：登录子域主体走 443，80 只留 ACME 验证与 301 跳转；
#     APK/桌面端登录页发 https://login.nextbot.top 即可，明文白名单可整表摘除
#   - 其余（IP 直访 / nextbot.top / www）→ Node 主服务，落地页在 /（80 保持原行为，
#     不强制跳 https，避免 IP 直访用户吃证书告警）
# Node 主服务常驻 127.0.0.1:3000（systemd: private-agent）。
# 持久化注意：/etc/iptables/rules.v4 里的 REDIRECT 规则必须与本项目同时摘除，
# 否则重启后内核层转发会绕过 nginx。
#
# ── 首次部署顺序（顺序错了 nginx -t 会因证书缺失失败，连带 80 一起挂）──
#   ① 先部署「不带两个 443 server 块」的版本（只多出 login:80 的 ACME location）
#      scp 上去后：nginx -t && systemctl reload nginx
#   ② 签发证书（80 可达 + 阿里云安全组放行 80/443）：
#        mkdir -p /var/www/certbot
#        certbot certonly --webroot -w /var/www/certbot -d login.nextbot.top \
#          --agree-tos -m <你的邮箱> --no-eff-email --deploy-hook "systemctl reload nginx"
#      续期由 systemd certbot.timer 自动跑（webroot 模式无需停 nginx）
#   ③ 把下方两个 443 server 块的注释打开，nginx -t && systemctl reload nginx
#   ④ 阿里云控制台 → 安全组 → 放行 443 入方向
#   证书路径默认 /etc/letsencrypt/live/login.nextbot.top/；换阿里云免费证书
#   （每年签 20 张那种）时改 ssl_certificate 两行为其 pem/key 路径即可。

# WebSocket Upgrade 头映射（ws 聊天 / 语音 duplex 透传必需）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ───────────────────────── 80 端口 ─────────────────────────

# 默认块：IP 直访与所有未匹配域名的保底，行为与此前 80→3000 完全一致
server {
    listen 80 default_server;
    server_name _;

    # 图片上传 / 图库等请求体放宽（nginx 默认 1m 会掐断）
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 长连接（WebSocket / SSE）不被默认 60s 空闲超时掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 登录子域 80：只留 ACME 挑战路径（HTTP-01 验证必须走 80），其余 301 到 https
server {
    listen 80;
    server_name login.nextbot.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

