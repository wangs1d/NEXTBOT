# NEXTBOT 后端 API — 159.75.52.2 (api.nextbot.top) 80/443 路由
# Node 主服务常驻 127.0.0.1:3000（systemd: pai-server）。
# 部署顺序：
#   ① 本文件（仅 80）先上：nginx -t && systemctl enable --now nginx
#   ② 腾讯云控制台安全组放行 80/443 入方向
#   ③ DNS 加 A 记录 api.nextbot.top → 159.75.52.2 后签发：
#        mkdir -p /var/www/certbot
#        certbot certonly --webroot -w /var/www/certbot -d api.nextbot.top \
#          --agree-tos -m <邮箱> --no-eff-email --deploy-hook "systemctl reload nginx"
#   ④ 打开下方 443 server 块注释，nginx -t && systemctl reload nginx
#   客户端（APK/桌面）随后烤入 https://api.nextbot.top

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80：保底反代（行为与直连 3000 等价）+ ACME 验证路径
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

